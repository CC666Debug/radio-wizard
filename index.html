<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>RadioWizard</title>
<meta name="description" content="Find any internet radio station. Searches Radio Browser, TuneIn, SHOUTcast, Radio Garden, radio.net, iHeart, laut.fm, Icecast, OnlineRadioBox and SomaFM at once, then plays it here or casts it to Nest speakers.">
<meta name="theme-color" content="#0e0b1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>
  /* Themes: a color (Wizard purple, Red, Blue, Green, Gold, Plain) in dark or light, plus an accent; per device. */
  :root {
    color-scheme: dark;
    --bg: #0e0b1a; --surface: #181329; --surface-2: #221b3a; --line: #352b57;
    --text: #efeaff; --muted: #a59bc8; --accent: #9b6bff; --accent-2: #5fe3ff; --gold: #ffd36b;
    --good: #7ee7a8; --bad: #ff6b8a; --radius: 16px;
    --top-bg: rgba(14, 11, 26, .92); --bar-bg: rgba(20, 15, 36, .96); --star: rgba(255, 255, 255, .5);
    --bar: 132px;
  }
  :root[data-palette="red"] { --bg: #160d0f; --surface: #221418; --surface-2: #2e1b20; --line: #4a2a31; --text: #f5e9eb; --muted: #b89aa0; --accent: #e0455f; --accent-2: #ffb36b; --top-bg: rgba(22, 13, 15, .92); --bar-bg: rgba(30, 17, 21, .96); }
  :root[data-palette="blue"] { --bg: #0a0f1a; --surface: #121a2b; --surface-2: #1a2540; --line: #2b3a5e; --text: #e8eefc; --muted: #98a6c8; --accent: #4f8cff; --accent-2: #5fe3ff; --top-bg: rgba(10, 15, 26, .92); --bar-bg: rgba(15, 22, 38, .96); }
  :root[data-palette="green"] { --bg: #0b1410; --surface: #13211a; --surface-2: #1b2e24; --line: #2c4639; --text: #e9f3ec; --muted: #9db3a5; --accent: #3fbf7f; --accent-2: #c9e86b; --top-bg: rgba(11, 20, 16, .92); --bar-bg: rgba(16, 28, 22, .96); }
  :root[data-palette="gold"] { --bg: #14110a; --surface: #211c10; --surface-2: #2d2616; --line: #4a3f22; --text: #f5efdf; --muted: #b8ab8a; --accent: #d9a520; --accent-2: #ffe08a; --top-bg: rgba(20, 17, 10, .92); --bar-bg: rgba(28, 24, 14, .96); }
  :root[data-palette="plain"] { --bg: #121214; --surface: #1c1c20; --surface-2: #26262b; --line: #3a3a40; --text: #ececef; --muted: #a0a0a8; --accent: #9a9ca6; --accent-2: #c8c8d0; --top-bg: rgba(18, 18, 20, .92); --bar-bg: rgba(26, 26, 30, .96); }
  :root[data-mode="light"] { color-scheme: light; --bg: #f6f3fd; --surface: #ffffff; --surface-2: #ece6fb; --line: #d9d0f2; --text: #1d1530; --muted: #6c6287; --accent: #6b3fd9; --accent-2: #0b8fb3; --good: #1f8f52; --bad: #c22a4b; --top-bg: rgba(246, 243, 253, .92); --bar-bg: rgba(255, 255, 255, .96); --star: transparent; }
  :root[data-mode="light"][data-palette="red"] { --bg: #fcf5f6; --surface-2: #f6e4e7; --line: #ecd0d5; --text: #2a1418; --muted: #7d5f65; --accent: #b8283f; --accent-2: #c2600c; --top-bg: rgba(252, 245, 246, .92); }
  :root[data-mode="light"][data-palette="blue"] { --bg: #f4f7fd; --surface-2: #e2eaf8; --line: #ccd8ee; --text: #121c30; --muted: #5d6a85; --accent: #2a62d0; --accent-2: #0b8fb3; --top-bg: rgba(244, 247, 253, .92); }
  :root[data-mode="light"][data-palette="green"] { --bg: #f4f9f6; --surface-2: #e1efe7; --line: #cbe0d3; --text: #13231a; --muted: #5d7366; --accent: #1f8a55; --accent-2: #6b8a0b; --top-bg: rgba(244, 249, 246, .92); }
  :root[data-mode="light"][data-palette="gold"] { --bg: #fbf8f0; --surface-2: #f3ebd6; --line: #e6dabb; --text: #2a220f; --muted: #7a6d4d; --accent: #9a6f05; --accent-2: #b5520b; --top-bg: rgba(251, 248, 240, .92); }
  :root[data-mode="light"][data-palette="plain"] { --bg: #f5f5f6; --surface-2: #e9e9ec; --line: #d6d6db; --text: #1b1b1f; --muted: #6a6a73; --accent: #55575f; --accent-2: #3d6a9e; --top-bg: rgba(245, 245, 246, .92); }
  :root { --glow: color-mix(in srgb, var(--accent) 35%, transparent); --accent-ink: color-mix(in srgb, var(--accent) 12%, #0b0614); }
  :root[data-mode="light"] { --accent-ink: #ffffff; }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse at 50% -80px, color-mix(in srgb, var(--accent) 25%, transparent), transparent 360px),
      radial-gradient(1px 1px at 14% 6%, var(--star), transparent),
      radial-gradient(1px 1px at 36% 2%, var(--star), transparent),
      radial-gradient(1.5px 1.5px at 62% 9%, var(--star), transparent),
      radial-gradient(1px 1px at 81% 4%, var(--star), transparent),
      radial-gradient(1px 1px at 92% 12%, var(--star), transparent);
    background-repeat: no-repeat; background-attachment: fixed;
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    padding: 0 16px calc(var(--bar) + max(16px, env(safe-area-inset-bottom)));
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 720px; margin: 0 auto; }

  header.top {
    position: sticky; top: 0; z-index: 5;
    margin: 0 -16px; padding: max(10px, env(safe-area-inset-top)) 16px 10px;
    background: var(--top-bg); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .titleRow { display: flex; align-items: center; gap: 10px; }
  .logo { width: 38px; height: 38px; border-radius: 10px; flex: none; }
  h1 {
    margin: 0; flex: 1; font: 700 1.35rem/1 "Cinzel Decorative", Georgia, serif; letter-spacing: .5px;
    background: linear-gradient(90deg, var(--gold), var(--accent) 55%, var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .castBtn {
    display: flex; align-items: center; gap: 6px; max-width: 46%;
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; cursor: pointer;
  }
  .castBtn svg { width: 20px; height: 20px; flex: none; }
  .castBtn span { font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .castBtn.on { border-color: var(--accent-2); color: var(--accent-2); box-shadow: 0 0 12px color-mix(in srgb, var(--accent-2) 25%, transparent); }
  .castBtn.nudge { animation: nudge 1s ease-in-out infinite alternate; }
  @keyframes nudge { to { box-shadow: 0 0 18px var(--glow); border-color: var(--accent); } }

  .searchRow { display: flex; gap: 8px; margin-top: 10px; }
  .search {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 10px;
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit; padding: 11px 0; }
  .search input::-webkit-search-cancel-button { display: none; }
  .iconBtn { background: none; border: 0; cursor: pointer; padding: 6px; color: var(--muted); display: grid; place-items: center; }
  .iconBtn svg { width: 20px; height: 20px; }
  .goBtn { border: 0; border-radius: 12px; padding: 0 16px; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer; }

  .tabs { display: flex; gap: 6px; margin-top: 10px; }
  .tab {
    flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 4px;
    font-size: .9rem; cursor: pointer; color: var(--muted);
  }
  .tab[aria-selected="true"] { background: var(--surface-2); color: var(--text); border-color: var(--accent); }

  .status { color: var(--muted); font-size: .85rem; margin: 12px 2px 6px; min-height: 1.2em; }
  .srcChips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 10px;
    font-size: .8rem; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .chip b { color: var(--text); font-weight: 600; }
  .chip.wait { opacity: .7; }
  .chip.wait::after { content: " …"; }
  .chip.fail { border-color: rgba(255, 107, 138, .4); }
  .chip.pick { border-color: var(--accent); color: var(--text); background: var(--surface-2); }

  .picks { margin-top: 14px; }
  .picks h2 { font-size: .95rem; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
  .picks .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .picks .chip { font-size: .9rem; padding: 7px 12px; color: var(--text); }
  .hint { color: var(--muted); font-size: .85rem; margin-top: 16px; line-height: 1.5; }

  ul.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .st {
    display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer;
  }
  .st:active { background: var(--surface-2); }
  .st.now { border-color: var(--accent); box-shadow: 0 0 14px var(--glow); }
  .st.checking { opacity: .55; }
  .st.dead { opacity: .45; }
  .art {
    width: 48px; height: 48px; border-radius: 10px; flex: none; object-fit: cover;
    background: var(--surface-2) url("icon-192.png") center / cover;
  }
  .st .body { flex: 1; min-width: 0; }
  .st .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st .meta { color: var(--muted); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st .srcs { display: flex; gap: 4px; margin-top: 3px; flex-wrap: wrap; }
  .tag { font-size: .68rem; padding: 1px 6px; border-radius: 6px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
  .tag.ok { color: var(--good); border-color: rgba(126, 231, 168, .35); }
  .tag.bad { color: var(--bad); border-color: rgba(255, 107, 138, .35); }
  .heart { background: none; border: 0; cursor: pointer; padding: 8px; font-size: 1.25rem; line-height: 1; color: var(--muted); }
  .heart.on { color: #ff5c9a; text-shadow: 0 0 10px rgba(255, 92, 154, .5); }
  .more { display: block; margin: 12px auto; }
  .empty { color: var(--muted); text-align: center; padding: 30px 10px; }

  .notice {
    margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line);
    font-size: .9rem; display: flex; gap: 10px; align-items: flex-start;
  }
  .notice span { flex: 1; }
  .notice button { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0 2px; font-size: 1.1rem; }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    padding: 10px 16px max(12px, env(safe-area-inset-bottom));
    background: var(--bar-bg); backdrop-filter: blur(12px); border-top: 1px solid var(--line);
  }
  .bar .wrap { display: grid; gap: 8px; }
  .barTop { display: flex; align-items: center; gap: 12px; }
  .bar .art { width: 52px; height: 52px; }
  .bar .art.spin { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 16px var(--glow); } }
  .np { flex: 1; min-width: 0; }
  .np .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np .sub { color: var(--muted); font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np .sub.live { color: var(--good); }
  .play {
    width: 52px; height: 52px; border-radius: 50%; border: 0; flex: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 65%, #000)); color: #fff; display: grid; place-items: center;
    box-shadow: 0 0 16px var(--glow);
  }
  .play svg { width: 24px; height: 24px; }
  .play:disabled { opacity: .5; cursor: default; }
  .volRow { display: flex; align-items: center; gap: 10px; }
  .volRow .iconBtn { padding: 2px; }
  .volRow .where { font-size: .75rem; color: var(--muted); white-space: nowrap; min-width: 4.5em; text-align: right; }
  input[type=range] { flex: 1; accent-color: var(--accent); }

  footer { text-align: center; color: var(--muted); font-size: .78rem; margin: 26px 0 8px; line-height: 1.7; }
  footer a { color: var(--muted); }
  #version { cursor: default; user-select: none; }

  dialog {
    background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 18px;
    width: min(560px, calc(100vw - 32px)); max-height: 85dvh; padding: 16px;
  }
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  dialog h3 { margin: 0 0 10px; }
  dialog label.srcOpt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
  dialog label.srcOpt small { color: var(--muted); display: block; }
  dialog label.srcOpt.off { opacity: .5; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
  dialog .row button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
  dialog .row button.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .bcHead { display: flex; align-items: center; gap: 8px; margin: 12px 0 10px; flex-wrap: wrap; }
  .bcHead .who { flex: 1; min-width: 0; color: var(--muted); font-size: .9rem; }
  .bcHead .who b { color: var(--text); }
  .btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 12px; cursor: pointer; font-size: .9rem; }
  .btn.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .field { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; color: var(--text); font: inherit; outline: 0; }
  .field:focus { border-color: var(--accent); }
  .bcForm { display: grid; gap: 10px; margin-top: 14px; }
  .album { display: flex; gap: 14px; align-items: center; margin: 12px 0; }
  .album img { width: 110px; height: 110px; border-radius: 12px; object-fit: cover; flex: none; background: var(--surface-2); }
  .album h2 { margin: 0 0 4px; font-size: 1.15rem; }
  .album .by { color: var(--muted); margin-bottom: 10px; }
  .trk { display: flex; gap: 10px; align-items: center; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
  .trk .n { color: var(--muted); width: 1.6em; text-align: right; font-size: .85rem; }
  .trk .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trk .d { color: var(--muted); font-size: .8rem; }
  .trk.now { border-color: var(--accent); box-shadow: 0 0 12px var(--glow); }
  .trk.off { opacity: .45; cursor: default; }
  .subRow { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .subRow .sub { min-width: 0; }
  .sHeart { background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 1rem; padding: 0 4px; flex: none; }
  .sHeart.on { color: #ff5c9a; }
  .prog { display: flex; align-items: center; gap: 8px; font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pTrack { flex: 1; height: 4px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .pTrack i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .volRow .iconBtn { font-size: 1.05rem; }
  #songsList { max-height: 60dvh; overflow: auto; }
  li.song { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  li.song .sTop { display: flex; align-items: center; gap: 6px; }
  li.song .sName { flex: 1; font-weight: 600; }
  li.song .heart { padding: 2px 4px; font-size: 1.05rem; }
  li.song .sMeta { color: var(--muted); font-size: .78rem; }
  li.song .sLinks { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; font-size: .82rem; }
  li.song .sLinks a { color: var(--accent-2); }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; margin-bottom: 14px; }
  .sw { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: .88rem; color: var(--text); }
  .sw span { width: 18px; height: 18px; border-radius: 50%; background: var(--c); flex: none; border: 1px solid rgba(128, 128, 128, .35); }
  .sw.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .sw.custom input { width: 24px; height: 24px; border: 0; padding: 0; background: none; cursor: pointer; }
  .themeSub { color: var(--muted); font-size: .85rem; margin: 0 0 6px; }
  #diagText { width: 100%; height: 50dvh; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; font: 12px/1.35 ui-monospace, Consolas, monospace; padding: 8px; }
</style>
<!-- Visit counter (GoatCounter: free, no cookies). Diag log has a "Don't count me" switch. -->
<script data-goatcounter="https://cc666debug.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="titleRow">
      <img class="logo" src="icon-192.png" alt="">
      <h1>RadioWizard</h1>
      <button class="iconBtn" id="themeBtn" type="button" title="Light or dark (hold for colors)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path id="themeIcon" d=""/></svg></button>
      <button class="castBtn" id="castBtn" type="button" title="Cast to a speaker">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 18v3h3a3 3 0 0 0-3-3zm0-4v2a5 5 0 0 1 5 5h2a7 7 0 0 0-7-7zm0-4v2a9 9 0 0 1 9 9h2A11 11 0 0 0 1 10zm20-7H3a2 2 0 0 0-2 2v3h2V5h18v14h-7v2h7a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg>
        <span id="castLabel">Cast</span>
      </button>
    </div>
    <form class="searchRow" id="searchForm" autocomplete="off">
      <label class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" enterkeyhint="search" placeholder="Station, genre, city…" aria-label="Search radio stations">
        <button class="iconBtn" id="clearQ" type="button" title="Clear" hidden>✕</button>
      </label>
      <button class="goBtn" type="submit">Search</button>
      <button class="iconBtn" id="srcBtn" type="button" title="Which directories to search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      </button>
    </form>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="search" aria-selected="true">Search</button>
      <button class="tab" role="tab" data-tab="favs" aria-selected="false">♥ Favorites</button>
      <button class="tab" role="tab" data-tab="recent" aria-selected="false">Recent</button>
      <button class="tab" role="tab" data-tab="bc" aria-selected="false">Bandcamp</button>
    </div>
  </header>

  <div class="notice" id="notice" hidden><span id="noticeText"></span><button id="noticeClose" title="Close">✕</button></div>
  <main id="main"></main>

  <footer>
    <div>Searches free public radio directories. Stations belong to their owners.</div>
    <div><a href="#" id="shareApp">Share RadioWizard</a></div>
    <div id="version"></div>
  </footer>
</div>

<div class="bar" id="bar">
  <div class="wrap">
    <div class="barTop">
      <img class="art" id="npArt" src="icon-192.png" alt="">
      <div class="np">
        <div class="name" id="npName">Nothing playing</div>
        <div class="subRow"><div class="sub" id="npSub">Search for a station and tap it</div><button class="sHeart" id="songHeart" title="Save this song" hidden>♡</button></div>
      </div>
      <button class="heart" id="npHeart" title="Favorite" hidden>♡</button>

// ── Testing stations (Android app) ──────────────
// The phone opens each stream for a moment: only stations that really send sound are listed.

async function linksFor(src) {

// ── Searching ───────────────────────────────────

    for (let u of await linksFor(src)) {

  ctx = cast.framework.CastContext.getInstance();

  player = new cast.framework.RemotePlayer();

  ctx.addEventListener(cast.framework.CastContextEventType.CAST_STATE_CHANGED, e => { diag('cast state: ' + e.castState); renderBar(); });
  ctx.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED, e => {
    const S = cast.framework.SessionState;
    diag('session: ' + e.sessionState + (e.errorCode ? ' · error ' + e.errorCode : '') + (e.session ? ' · ' + e.session.getCastDevice().friendlyName : ''));
    if (e.sessionState === S.SESSION_STARTED) {
      els.castBtn.classList.remove('nudge');
      // A speaker was picked: what the phone was playing moves over to it.
      if (bc && bc.where === 'here') { const pos = audio.currentTime || 0; audio.pause(); bc.where = 'speaker'; bcLoadSpeaker(pos); }
      else if (here && current) { stopHere(); loadOnSpeaker(current); }
    }
    if (e.sessionState === S.SESSION_RESUMED) speakerStation = current;
    if (e.sessionState === S.SESSION_START_FAILED) showNotice('The speaker didn’t accept the connection. Try again.');
    if (e.sessionState === S.SESSION_ENDING) {
      if (bc && bc.where === 'speaker') bc.carry = castActive() && !speakerPaused() ? { pos: player.currentTime || 0 } : null;
      else carryOver = castActive() && !speakerPaused() && current ? current : null;
    }
    if (e.sessionState === S.SESSION_ENDED) {
      if (bc && bc.where === 'speaker') { const c = bc.carry; bc.where = 'here'; bc.carry = null; if (c) bcPlayHere(c.pos); else bc.state = 'paused'; }
      else if (!carryOver) songStop();
      songWatchFor = null;
      speakerLoading = speakerStation = null;

    }

};

  if (!links) { links = await streamsFor(st); links.i = 0; }
  if (speakerLoading !== st) return;
  speakerLinks = links;
  const l = links[links.i];
  if (!l) { speakerLoading = null; showNotice(st.name + ' won’t play on the speaker. Try another station.'); renderBar(); return; }
  const info = new chrome.cast.media.MediaInfo(l.url, l.type);
  info.streamType = chrome.cast.media.StreamType.LIVE;
  const md = new chrome.cast.media.GenericMediaMetadata();

  md.subtitle = 'RadioWizard';
  md.images = [new chrome.cast.Image(st.img && st.img.startsWith('https:') ? st.img : new URL('icon-512.png', location.href).href)];

// The speaker's standard player often sits "buffering" before the sound starts; a quick pause + play gets it going.
const NUDGE_AFTER = 500, NUDGE_WINDOW = 60000;

  if (!player || Date.now() > nudgeUntil || nudges >= 4 || player.playerState !== PS.BUFFERING) return;
  nudgeTimer = setTimeout(() => {
    const session = ctx.getCurrentSession();
    const media = session && session.getMediaSession();
    if (!media || player.playerState !== PS.BUFFERING) return;
    nudges++;
    diag('nudge ' + nudges + ': speaker stalled buffering, pause + play');
    const done = () => renderBar();
    media.pause(new chrome.cast.media.PauseRequest(), () => media.play(new chrome.cast.media.PlayRequest(), done, done), done);
  }, NUDGE_AFTER);
}
let lastSpeakerState = null;
function onSpeakerState() {
  const PS = chrome.cast.media.PlayerState;
  if (player.playerState === lastSpeakerState) return;
  const session = ctx.getCurrentSession();
  const media = session && session.getMediaSession && session.getMediaSession();
  diag('speaker player: ' + (player.playerState || 'none') + (player.playerState === PS.IDLE && media && media.idleReason ? ' (' + media.idleReason + ')' : ''));
  watchStall();
  lastSpeakerState = player.playerState;
  if (bc && bc.where === 'speaker') { bcSpeakerState(media); return; }
  if (player.playerState === PS.PLAYING) {
    if (speakerLoading && speakerLinks) rememberWorking(speakerLoading, speakerLinks[speakerLinks.i]);
    speakerStation = speakerLoading || speakerStation || current; speakerLoading = null; speakerRetries = 0;
    const sl = speakerLinks && speakerLinks[speakerLinks.i];
    if (speakerStation && songWatchFor !== speakerStation.key) { songWatchFor = speakerStation.key; songWatch(speakerStation, sl ? sl.url : safeGet('rw_cast')); }
    return;
  }
  if (player.playerState !== PS.IDLE) return;
  const IR = chrome.cast.media.IdleReason, why = media && media.idleReason;
  if (speakerLoading && why === IR.ERROR) {   // this link doesn't play on the speaker: try the next one
    const st = speakerLoading;
    if (speakerLinks) { speakerLinks.i++; loadOnSpeaker(st, speakerLinks); }
    return;
  }
  if (!speakerStation) return;
  const dropped = why === IR.ERROR || why === IR.FINISHED;
  if (!dropped || speakerRetries >= 4) { speakerStation = null; return; }
  speakerRetries++;   // live radio never "finishes": the stream dropped, so start it again
  const st = speakerStation;
  setTimeout(() => { if (castConnected() && !castActive()) loadOnSpeaker(st); }, 2000 * speakerRetries);
}
const castConnected = () => !!(ctx && ctx.getCurrentSession());
const castActive = () => !!ctx && !!player && player.isMediaLoaded && !!player.playerState && player.playerState !== chrome.cast.media.PlayerState.IDLE;
const speakerPaused = () => !!player && player.playerState === chrome.cast.media.PlayerState.PAUSED;

// ── Bandcamp: your own collection (Android app) ─
// Bandcamp has no app access for listeners, so this reads the collection the way bandcamp.com does:
// the fan's public collection list, then each album page for its song links (they work for about a day).
// Signing in (optional) lets bought songs play in full where Bandcamp only gives everyone else a preview.
let bcUser = safeGet('rw_bc_user') || '';
let bcItems = readJSON('rw_bc_items', []);

let bc = null;   // what's playing: { queue: [tracks], i, shuffle, where: 'here' | 'speaker', state }
const BC_CAN = NATIVE;

const bcArt = id => id ? 'https://f4.bcbits.com/img/a' + id + '_2.jpg' : '';
async function bcFanId() {
  // Signed in: Bandcamp says who you are. Otherwise the fan page holds the id.
  try {
    const d = await getJSON('https://bandcamp.com/api/fan/2/collection_summary');
    if (d && d.fan_id) {
      if (d.collection_summary && d.collection_summary.username) { bcUser = d.collection_summary.username; safeSet('rw_bc_user', bcUser); }
      return d.fan_id;
    }
  } catch (e) {}
  if (!bcUser) throw new Error('no username');
  const r = await get('https://bandcamp.com/' + encodeURIComponent(bcUser));
  const m = r.text.match(/fan_id&quot;:(\d+)/) || r.text.match(/"fan_id":(\d+)/);
  if (!m) throw new Error(r.status === 404 ? 'That Bandcamp page wasn’t found.' : 'Couldn’t read that Bandcamp page.');
  return +m[1];
}
async function bcLoad() {
  if (bcBusy) return;
  bcBusy = 'Loading your collection…'; render();
  try {
    const fan = await bcFanId();
    const out = [];
    let token = Math.floor(Date.now() / 1000) + '::a::';
    for (let page = 0; page < 60; page++) {
      const d = await getJSON('https://bandcamp.com/api/fancollection/1/collection_items', { method: 'POST', type: 'application/json', body: JSON.stringify({ fan_id: fan, older_than_token: token, count: 100 }) });
      (d.items || []).forEach(x => {
        if (!x.item_url) return;
        out.push({ id: x.tralbum_type + x.tralbum_id, title: x.album_title || x.item_title, artist: x.band_name, url: x.item_url, art: bcArt(x.item_art_id), type: x.tralbum_type });
      });
      bcBusy = 'Loading your collection… ' + out.length; render();
      if (!d.more_available || !d.last_token) break;
      token = d.last_token;
    }
    bcItems = out.filter((x, i) => out.findIndex(y => y.id === x.id) === i);
    safeSet('rw_bc_items', JSON.stringify(bcItems));
    diag('bandcamp: ' + bcItems.length + ' items for fan ' + fan);
  } catch (e) {
    diag('bandcamp load FAILED: ' + e.message);
    showNotice(e.message && e.message.length > 20 ? e.message : 'Couldn’t load the Bandcamp collection. Check the name and try again.');
  }
  bcBusy = ''; render();
}

const bcTrackCache = new Map();   // album link -> { at, tracks }
async function bcTracks(item) {
  const hit = bcTrackCache.get(item.url);
  if (hit && Date.now() - hit.at < 3 * 3600e3) return hit.tracks;
  const r = await get(item.url);
  const m = r.text.match(/data-tralbum="([^"]+)"/);
  if (!m) throw new Error('no album data');
  const d = JSON.parse(unent(m[1]));
  const tracks = (d.trackinfo || []).map((t, n) => ({
    n: t.track_num || n + 1, title: t.title, artist: t.artist || item.artist, album: item.title, art: item.art, dur: t.duration || 0,
    url: t.file && (t.file['mp3-v0'] || t.file['mp3-128']) || null,
  }));
  bcTrackCache.set(item.url, { at: Date.now(), tracks });
  return tracks;
}
const bcTime = s => { s = Math.round(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const bcTrack = () => bc && bc.queue[bc.i];

function bcView() {
  let h = '';
  if (!BC_CAN) return '<div class="empty">Bandcamp needs the RadioWizard Android app (Bandcamp blocks websites).</div>';
  if (bcAlbum) {
    const a = bcAlbum;
    h += '<div class="bcHead"><button class="btn" id="bcBack">‹ Back</button></div>';
    h += '<div class="album"><img src="' + esc(a.art || 'icon-192.png') + '" alt=""><div><h2>' + esc(a.title) + '</h2><div class="by">' + esc(a.artist) + '</div>'
      + '<button class="btn main" id="bcPlayAll">▶ Play</button> <button class="btn" id="bcShuf">🔀 Shuffle</button></div></div>';
    if (!a.tracks) h += '<div class="empty">' + (a.err ? 'Couldn’t open this album. Try again.' : 'Opening…') + '</div>';
    else {
      const playing = bcTrack();
      h += '<ul class="list">' + a.tracks.map((t, i) => '<li class="trk' + (t.url ? '' : ' off') + (playing && playing.url && playing.url === t.url ? ' now' : '') + '" data-t="' + i + '"><span class="n">' + t.n + '</span><span class="t">' + esc(t.title)
        + '</span><span class="d">' + (t.url ? bcTime(t.dur) : 'not streamable') + '</span></li>').join('') + '</ul>';
    }
    return h;
  }
  if (!bcItems.length && !bcBusy) {
    h += '<div class="bcForm"><div>Play and cast the music you’ve bought on Bandcamp.</div>'
      + '<input class="field" id="bcName" placeholder="Your Bandcamp name (bandcamp.com/…)" value="' + esc(bcUser) + '" autocapitalize="off" autocomplete="off">'
      + '<button class="btn main" id="bcGo">Load my collection</button>'
      + '<button class="btn" id="bcLogin">' + (bcSignedIn ? 'Signed in ✓' : 'Sign in to Bandcamp (optional)') + '</button>'
      + '<div class="hint" style="margin-top:0">Signing in lets every song you bought play in full; without it, some albums only play Bandcamp’s preview. Your password goes to Bandcamp’s own page and stays on this phone.</div></div>';
    return h;
  }
  h += '<div class="bcHead"><div class="who"><b>' + esc(bcUser || 'Bandcamp') + '</b> · ' + (bcBusy ? esc(bcBusy) : bcItems.length + ' items') + '</div>'
    + '<button class="btn main" id="bcShufAll">🔀 Shuffle all</button><button class="btn" id="bcMenu">⋯</button></div>';
  h += '<input class="field" id="bcFilter" placeholder="Filter by album or artist" value="' + esc(bcFilter) + '" autocomplete="off">';
  h += '<ul class="list" id="bcList" style="margin-top:10px">' + bcListHtml() + '</ul>';
  return h;
}
function bcListHtml() {
  const f = bcFilter.toLowerCase().trim();
  bcShown = f ? bcItems.filter(x => (x.title + ' ' + x.artist).toLowerCase().includes(f)) : bcItems;
  const cut = bcShown.slice(0, bcMore);
  return cut.map((x, i) => '<li class="st" data-bcalbum="' + i + '"><img class="art" loading="lazy" alt="" src="' + esc(x.art || 'icon-192.png') + '" onerror="this.onerror=null;this.src=\'icon-192.png\'">'
    + '<div class="body"><div class="name">' + esc(x.title) + '</div><div class="meta">' + esc(x.artist) + (x.type === 't' ? ' · single track' : '') + '</div></div></li>').join('')
    + (bcShown.length > bcMore ? '<li><button class="chip more" id="bcMoreBtn">Show more (' + (bcShown.length - bcMore) + ')</button></li>' : '')
    + (!bcShown.length && !bcBusy ? '<li class="empty">Nothing matches.</li>' : '');
}
let bcMore = 150;
function bcWire() {
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on('bcGo', () => { const n = ($('bcName').value || '').trim().replace(/^.*bandcamp\.com\//i, '').replace(/[/?#].*$/, ''); if (!n && !bcSignedIn) return; bcUser = n || bcUser; safeSet('rw_bc_user', bcUser); bcLoad(); });
  on('bcLogin', () => { if (window.AndroidCast.bandcampLogin) window.AndroidCast.bandcampLogin(); });
  on('bcBack', () => { bcAlbum = null; render(); });
  on('bcPlayAll', () => bcPlayAlbum(bcAlbum, 0));
  on('bcShuf', () => bcPlayAlbum(bcAlbum, -1));
  on('bcShufAll', () => bcShuffleAll());
  on('bcMenu', () => $('bcDlg').showModal());
  on('bcMoreBtn', () => { bcMore += 150; $('bcList').innerHTML = bcListHtml(); bcWire(); });
  const f = $('bcFilter');
  if (f) f.oninput = () => { bcFilter = f.value; bcMore = 150; $('bcList').innerHTML = bcListHtml(); bcWire(); };
}
window.onBandcampLogin = ok => {
  diag('bandcamp sign-in: ' + (ok ? 'yes' : 'closed'));
  if (!ok) return;
  bcSignedIn = true; safeSet('rw_bc_in', 't');
  bcTrackCache.clear();
  bcLoad();
};

async function bcOpenAlbum(item) {
  if (!item) return;
  bcAlbum = Object.assign({}, item);
  render(); window.scrollTo(0, 0);
  try { bcAlbum.tracks = await bcTracks(item); } catch (e) { diag('bandcamp album FAILED ' + item.url + ': ' + e.message); bcAlbum.err = true; }
  if (tab === 'bc' && bcAlbum && bcAlbum.url === item.url) render();
}
function bcShuffle(list) { for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; } return list; }
function bcStart(queue, i, shuffle) {

  stopHere();

  bc = { queue, i, shuffle, where: castConnected() ? 'speaker' : 'here', state: 'starting' };
  hideNotice();
  bcGo(0);
}
function bcPlayAlbum(album, from) {
  if (!album || !album.tracks) return;
  const ok = album.tracks.filter(t => t.url);
  if (from === -1) bcStart(bcShuffle(ok.slice()), 0, false);
  else { const t = album.tracks[from]; bcStart(ok, Math.max(0, ok.indexOf(t)), false); }
}
async function bcRandomTrack() {
  for (let k = 0; k < 5 && bcItems.length; k++) {
    const item = bcItems[Math.floor(Math.random() * bcItems.length)];
    try { const ok = (await bcTracks(item)).filter(t => t.url); if (ok.length) return ok[Math.floor(Math.random() * ok.length)]; } catch (e) {}

}

  bcStart([t], 0, true);
}
// Shuffle all: the next random song is picked while this one plays, so there's no gap.
let bcPre = null;
function bcPrefetch() {

  bcPre = bcRandomTrack().then(t => { if (t && bc && bc.shuffle) bc.queue.push(t); bcPre = null; });
}
async function bcNext() {
  if (!bc) return;
  if (bc.i >= bc.queue.length - 1 && bc.shuffle) { if (!bcPre) bcPrefetch(); if (bcPre) await bcPre; }
  if (!bc) return;
  if (bc.i >= bc.queue.length - 1) { diag('bandcamp: end of queue'); bc.state = 'ended'; renderBar(); return; }
  bc.i++;
  bcGo(0);
}
function bcHeard() {
  const t = bcTrack();
  if (!t || bc.heardUrl === t.url) return;
  bc.heardUrl = t.url;
  const name = t.artist + ' – ' + t.title;
  if (!heard[0] || songKey(heard[0].song) !== songKey(name)) {
    heard.unshift({ song: name, station: 'Bandcamp · ' + t.album, at: Date.now() });
    heard = heard.slice(0, 60);
    safeSet('rw_heard', JSON.stringify(heard));
  }
}
function bcGo(pos) {
  const t = bcTrack();
  if (!t) return;
  songStop();
  bc.state = 'starting';
  diag('bandcamp ' + (bc.where === 'speaker' ? 'to speaker' : 'here') + ': ' + t.artist + ' – ' + t.title);
  if (bc.where === 'speaker' && castConnected()) bcLoadSpeaker(pos);
  else { bc.where = 'here'; bcPlayHere(pos); }
  renderBar(); if (tab === 'bc' && bcAlbum) render();
}
function bcPlayHere(pos) {
  const t = bcTrack();
  if (!t) return;
  bc.where = 'here'; bc.state = 'starting';
  audio.src = t.url;
  if (pos) audio.addEventListener('loadedmetadata', () => { try { audio.currentTime = pos; } catch (e) {} }, { once: true });
  audio.play().catch(err => diag('play() refused: ' + err.message));
  renderBar();
}
function bcLoadSpeaker(pos) {
  const session = ctx && ctx.getCurrentSession();
  const t = bcTrack();
  if (!session || !t) return;
  bc.where = 'speaker'; bc.state = 'starting';
  bcClock.start = 0; bcClock.pos = pos || 0; bcClock.paused = true;
  const info = new chrome.cast.media.MediaInfo(t.url, 'audio/mpeg');
  info.streamType = chrome.cast.media.StreamType.BUFFERED;
  const md = new chrome.cast.media.GenericMediaMetadata();
  md.title = t.title;
  md.subtitle = t.artist + ' · ' + t.album;
  md.images = [new chrome.cast.Image(t.art || new URL('icon-512.png', location.href).href)];
  info.metadata = md;
  const req = new chrome.cast.media.LoadRequest(info);
  req.autoplay = true;
  if (pos) req.currentTime = pos;
  bc.sent = t.url;
  session.loadMedia(req).then(() => diag('speaker accepted the song')).catch(err => { diag('speaker REFUSED the song · ' + err); if (bc && bc.sent === t.url) bcNext(); });

function bcSpeakerState(media) {
  const PS = chrome.cast.media.PlayerState, IR = chrome.cast.media.IdleReason;

  if (player.playerState === PS.PAUSED) { bc.state = 'paused'; bcClockPause(); return; }
  if (player.playerState !== PS.IDLE || bc.state === 'starting' && !(media && media.idleReason)) return;
  const why = media && media.idleReason;
  if (why === IR.FINISHED || why === IR.ERROR) bcNext();   // song over (or it couldn't play): on to the next

function bcToggle() {
  if (!bc) return;

  if (bc.where === 'speaker' && castConnected()) {
    if (castActive()) ctrl.playOrPause(); else bcLoadSpeaker(0);
  } else if (audio.paused) { if (audio.getAttribute('src')) audio.play(); else bcPlayHere(0); }
  else audio.pause();

}
function bcStop() {
  if (!bc) return;

  bc = null; bcPre = null;

}
function bcRenderBar(cast, dev) {
  const t = bcTrack();
  els.npName.textContent = t ? t.title : 'Bandcamp';
  els.npArt.src = t && t.art ? t.art : 'icon-192.png';
  els.npHeart.hidden = true;
  let sub = t ? t.artist + ' · ' + t.album : '', playing = false, busy = false;
  if (bc.where === 'speaker' && cast) {
    const PS = chrome.cast.media.PlayerState;
    if (bc.state === 'starting' || player.playerState === PS.BUFFERING) { sub = 'Starting on ' + dev + '…'; busy = true; playing = true; }
    else if (speakerPaused() || bc.state === 'paused') sub = 'Paused on ' + dev + ' · ' + sub;
    else if (bc.state === 'ended') sub = 'Finished · tap play to start again';
    else { sub = sub + ' · on ' + dev; playing = true; }
    if (player && player.volumeLevel != null && document.activeElement !== els.vol) els.vol.value = Math.round(player.volumeLevel * 100);
  } else {
    if (bc.state === 'starting') { busy = true; playing = true; sub = 'Starting… · ' + sub; }
    else if (bc.state === 'ended') sub = 'Finished · tap play to start again';
    else if (!audio.paused) playing = true;
    else sub = 'Paused · ' + sub;
  }
  els.npSub.textContent = sub;
  els.npSub.classList.toggle('live', false);
  els.npArt.classList.toggle('spin', busy);
  els.playBtn.disabled = false;
  els.playIcon.innerHTML = playing ? '<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
}
$('bcRefresh').addEventListener('click', () => { $('bcDlg').close(); bcLoad(); });
$('bcLoginBtn').addEventListener('click', () => { $('bcDlg').close(); if (window.AndroidCast.bandcampLogin) window.AndroidCast.bandcampLogin(); });
$('bcForget').addEventListener('click', () => {
  $('bcDlg').close();
  bcItems = []; bcUser = ''; bcSignedIn = false; bcAlbum = null;
  ['rw_bc_items', 'rw_bc_user', 'rw_bc_in'].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
  if (window.AndroidCast && window.AndroidCast.bandcampLogout) window.AndroidCast.bandcampLogout();
  render();
});
$('bcDlg').addEventListener('click', e => { if (e.target === $('bcDlg')) $('bcDlg').close(); });

// ── Song info, cover art, time bar, Recently played and Saved songs ─
// Radio: the song title comes from the station itself. The apps read it straight from the stream ("ICY" titles);
// laut.fm and SomaFM have their own song lists, and Icecast servers publish theirs (status-json.xsl).
// Cover art: Apple's free music search. Bandcamp songs already carry their title and cover.
let song = '', songArt = '', songAt = 0, songEnds = 0, songStarts = 0, songWatchTok = 0, songTimer = null;
let heard = readJSON('rw_heard', []);     // [{ song, station, at }]
let saved = readJSON('rw_saved', []);     // [{ song, station, at }]
const songKey = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();

function cleanTitle(t) {
  t = String(t || '').replace(/\s+/g, ' ').trim();
  if (!t || t.length < 3 || /^(-|–|unknown|n\/a|null|undefined|live|on air)$/i.test(t)) return '';
  return t.replace(/\s+-\s+/, ' – ');
}
async function songFromLaut(src) {
  const name = src.url.replace(/^https?:\/\//, '').split('/').pop().split('?')[0];
  const d = await getJSON('https://api.laut.fm/station/' + encodeURIComponent(name) + '/current_song');
  if (!d || !d.title) return null;
  return { title: (d.artist && d.artist.name ? d.artist.name + ' – ' : '') + d.title, starts: Date.parse(d.started_at) || 0, ends: Date.parse(d.ends_at) || 0 };
}
async function songFromSoma(src) {
  const id = (src.url.match(/somafm\.com\/([a-z0-9]+)-/) || [])[1];
  if (!id) return null;
  const d = await getJSON('https://api.somafm.com/songs/' + id + '.json');
  const s = d && d.songs && d.songs[0];
  return s ? { title: (s.artist ? s.artist + ' – ' : '') + s.title, starts: (+s.date || 0) * 1000 } : null;
}
async function songFromIcecast(url) {
  const u = new URL(url);
  if (location.protocol === 'https:' && u.protocol === 'http:' && !NATIVE) return null;   // browsers block it
  const d = await getJSON(u.origin + '/status-json.xsl', { timeout: 6000 });
  let src = d && d.icestats && d.icestats.source;
  if (!src) return null;
  if (!Array.isArray(src)) src = [src];
  const mine = src.find(x => x.listenurl && new URL(x.listenurl).pathname === u.pathname) || (src.length === 1 ? src[0] : null);
  if (!mine) return null;
  const t = mine.title ? (mine.artist ? mine.artist + ' – ' : '') + mine.title : mine.yp_currently_playing;
  return t ? { title: t } : null;
}
async function songFromIcy(url) {
  if (!NATIVE || !window.AndroidCast.icy) return null;
  const r = await native('icy', { url, timeout: 9000 });
  return r && r.ok && r.title ? { title: r.title } : null;
}
async function lookUpSong(st, url) {
  const tries = [];
  st.srcs.forEach(s => { if (s.src === 'laut' && s.url) tries.push(() => songFromLaut(s)); if (s.src === 'soma' && s.url) tries.push(() => songFromSoma(s)); });
  if (url) { tries.push(() => songFromIcy(url)); tries.push(() => songFromIcecast(url)); }
  for (const t of tries) {
    try { const r = await t(); if (r && cleanTitle(r.title)) return r; } catch (e) {}
  }
  return null;
}

// Watches the station being played (here or on the speaker) and checks its song every 20 seconds.
let songWatchKey = '';
function songWatch(st, url) {
  const key = st && url ? st.key + '|' + url : '';
  if (key && key === songWatchKey) return;   // already watching this one
  songWatchKey = key;
  const tok = ++songWatchTok;
  clearTimeout(songTimer);
  if (!st || !url) { setSong('', '', 0, 0); return; }
  let misses = 0;
  const check = async () => {
    if (tok !== songWatchTok) return;
    const r = await lookUpSong(st, url);
    if (tok !== songWatchTok) return;
    if (r) { misses = 0; setSong(cleanTitle(r.title), st.name, r.starts || 0, r.ends || 0); }
    else if (++misses === 3) diag('no song titles from ' + st.name);
    // laut.fm says when the song ends: check right after; otherwise every 20 seconds (less if it never answers).
    const wait = songEnds > Date.now() ? Math.min(songEnds - Date.now() + 1500, 60000) : misses >= 3 ? 60000 : 20000;
    songTimer = setTimeout(check, wait);
  };
  check();
}
function songStop() { songWatchKey = ''; songWatchTok++; clearTimeout(songTimer); setSong('', '', 0, 0); }

let artTok = 0;
function setSong(title, station, starts, ends, art) {
  if (title === song && !art) { songStarts = starts || songStarts; songEnds = ends || songEnds; return; }
  song = title; songStarts = starts || (title ? Date.now() : 0); songEnds = ends || 0; songAt = Date.now();
  songArt = art || '';
  if (title) {
    diag('song: ' + title);
    if (!heard[0] || songKey(heard[0].song) !== songKey(title)) {
      heard.unshift({ song: title, station, at: Date.now() });
      heard = heard.slice(0, 60);
      safeSet('rw_heard', JSON.stringify(heard));
    }
    if (!art) findArt(title);
  }
  renderBar(); setMedia();
}
// Cover art for the song from Apple's music search (free, no key).
const artCache = new Map();
async function findArt(title) {
  const tok = ++artTok;
  const key = songKey(title);
  let url = artCache.get(key);
  if (url === undefined) {
    url = '';
    try {
      const term = title.replace(/\(.*?\)|\[.*?\]/g, ' ').replace(/ – /, ' ').trim();
      const d = await getJSON('https://itunes.apple.com/search?entity=song&limit=1&term=' + encodeURIComponent(term), { timeout: 8000 });
      const r = d.results && d.results[0];
      // Only trust it when the artist matches what the station says.
      const artist = title.split(' – ')[0].toLowerCase();
      if (r && r.artworkUrl100 && r.artistName && (artist.includes(r.artistName.toLowerCase()) || r.artistName.toLowerCase().includes(artist))) url = r.artworkUrl100.replace('100x100bb', '600x600bb');
    } catch (e) {}
    artCache.set(key, url);
  }
  if (tok !== artTok || songKey(song) !== key) return;
  if (url) { songArt = url; renderBar(); setMedia(); }
}

// ── The time bar ──
// Radio: only when the station says how long the song is (laut.fm). Bandcamp: always.
const pEls = { box: $('prog'), t: $('pT'), d: $('pD'), fill: $('pFill') };
function songClock() {
  if (bc && bcTrack()) {
    const t = bcTrack();
    let pos = 0;
    if (bc.where === 'here') pos = audio.currentTime || 0;
    else if (bcClock.start) pos = bcClock.paused ? bcClock.pos : (performance.now() - bcClock.start) / 1000;
    return { pos, dur: t.dur || (bc.where === 'here' ? audio.duration : 0) || 0 };
  }
  if (song && songEnds > songStarts && songStarts) return { pos: (Date.now() - songStarts) / 1000, dur: (songEnds - songStarts) / 1000 };
  return null;
}
// On the speaker the app keeps its own count of where the song is (started, paused, resumed).
const bcClock = { start: 0, pos: 0, paused: false };
function bcClockPlaying(fromPos) { if (bcClock.start && !bcClock.paused) return; bcClock.start = performance.now() - (fromPos != null ? fromPos : bcClock.pos) * 1000; bcClock.paused = false; }
function bcClockPause() { if (bcClock.start && !bcClock.paused) { bcClock.pos = (performance.now() - bcClock.start) / 1000; bcClock.paused = true; } }
function drawClock() {
  const c = songClock();
  if (!c || !isFinite(c.dur) || c.dur <= 0) { pEls.box.hidden = true; return; }
  pEls.box.hidden = false;
  const pos = Math.max(0, Math.min(c.pos, c.dur));
  pEls.t.textContent = bcTime(pos);
  pEls.d.textContent = bcTime(c.dur);
  pEls.fill.style.width = (pos / c.dur * 100).toFixed(2) + '%';
}
setInterval(drawClock, 500);

// ── Song heart, Recently played and Saved songs ──
const isSaved = t => saved.some(x => songKey(x.song) === songKey(t));
function nowSong() {
  if (bc && bcTrack()) { const t = bcTrack(); return { song: t.artist + ' – ' + t.title, station: 'Bandcamp · ' + t.album }; }
  return song ? { song, station: current ? current.name : '' } : null;
}
function toggleSaved(x) {
  if (!x) return;
  if (isSaved(x.song)) saved = saved.filter(y => songKey(y.song) !== songKey(x.song));
  else saved.unshift({ song: x.song, station: x.station, at: Date.now() });
  safeSet('rw_saved', JSON.stringify(saved));
  renderBar();
  if ($('songsDlg').open) drawSongs();
}
$('songHeart').addEventListener('click', () => toggleSaved(nowSong()));
function timeAgo(ms) {
  const min = Math.round((Date.now() - ms) / 60000);
  return min < 1 ? 'just now' : min < 60 ? min + ' min ago' : min < 1440 ? Math.floor(min / 60) + ' hr ago' : Math.floor(min / 1440) + ' d ago';
}
let songsTab = 'recent';
function drawSongs() {
  document.querySelectorAll('#songsDlg [data-stab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.stab === songsTab)));
  const list = songsTab === 'recent' ? heard : saved;
  const ul = $('songsList');
  ul.innerHTML = list.length ? '' : '<li class="empty">' + (songsTab === 'recent' ? 'Songs you hear show up here.' : 'Tap ♡ next to a song to keep it here.') + '</li>';
  list.forEach((x, i) => {
    const q = encodeURIComponent(x.song.replace(' – ', ' '));
    const li = document.createElement('li');
    li.className = 'song';
    li.innerHTML = '<div class="sTop"><div class="sName"></div><button class="heart' + (isSaved(x.song) ? ' on' : '') + '" data-sv="' + i + '">' + (isSaved(x.song) ? '♥' : '♡') + '</button></div>'
      + '<div class="sMeta"></div><div class="sLinks">'
      + '<a href="https://www.youtube.com/results?search_query=' + q + '" target="_blank" rel="noopener">YouTube</a>'
      + '<a href="https://music.youtube.com/search?q=' + q + '" target="_blank" rel="noopener">YouTube Music</a>'
      + '<a href="https://open.spotify.com/search/' + q + '" target="_blank" rel="noopener">Spotify</a>'
      + '<a href="https://bandcamp.com/search?q=' + q + '" target="_blank" rel="noopener">Bandcamp</a></div>';
    li.querySelector('.sName').textContent = x.song;
    li.querySelector('.sMeta').textContent = (x.station || '') + ' · ' + timeAgo(x.at);
    ul.appendChild(li);
  });
  $('songsCopy').hidden = !list.length;
}
$('songsList').addEventListener('click', e => {
  const b = e.target.closest('[data-sv]');
  if (b) toggleSaved((songsTab === 'recent' ? heard : saved)[+b.dataset.sv]);
});
document.querySelectorAll('#songsDlg [data-stab]').forEach(b => b.addEventListener('click', () => { songsTab = b.dataset.stab; drawSongs(); }));
$('songsBtn').addEventListener('click', () => { drawSongs(); $('songsDlg').showModal(); });
$('songsClose').addEventListener('click', () => $('songsDlg').close());
$('songsDlg').addEventListener('click', e => { if (e.target === $('songsDlg')) $('songsDlg').close(); });
$('songsCopy').addEventListener('click', () => {
  const list = songsTab === 'recent' ? heard : saved;
  const text = '# RadioWizard · ' + (songsTab === 'recent' ? 'recently played' : 'saved songs') + '\n\n' + list.map(x => '- ' + x.song + (x.station ? ' (' + x.station + ')' : '')).join('\n') + '\n';
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => { $('songsCopy').textContent = 'Copied'; setTimeout(() => $('songsCopy').textContent = 'Copy list', 1500); }, () => {});
});
$('songShare').addEventListener('click', () => {
  const x = nowSong();
  if (!x) return;
  const text = '🎵 ' + x.song + (x.station ? ' on ' + x.station : '') + ' · via RadioWizard';
  if (window.AndroidCast && window.AndroidCast.shareText && !window.AndroidCast.desktop) { window.AndroidCast.shareText('Song', text); return; }
  if (navigator.share && !window.AndroidCast) { navigator.share({ text }).catch(() => {}); return; }
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => showNotice('Song copied: ' + x.song));
});

// ── Share, diag log, version ────────────────────
$('shareApp').addEventListener('click', e => {
  e.preventDefault();
  const url = 'https://cc666debug.github.io/radio-wizard/', text = 'RadioWizard: find any radio station and cast it to your speakers.';
  if (window.AndroidCast && window.AndroidCast.shareText) { window.AndroidCast.shareText('RadioWizard', text + '\n' + url); return; }
  if (navigator.share) navigator.share({ title: 'RadioWizard', text, url }).catch(() => {});
  else navigator.clipboard.writeText(url).then(() => showNotice('Link copied.'));
});
const ver = $('version');
ver.textContent = 'v' + VERSION;
let taps = 0, tapTimer = null;
ver.addEventListener('click', () => {
  taps++; clearTimeout(tapTimer); tapTimer = setTimeout(() => taps = 0, 1500);
  if (taps >= 5) { taps = 0; openDiag(); }
});
const diagDlg = $('diagDlg');
function gcLabel() { $('gcBtn').textContent = safeGet('skipgc') === 't' ? 'Count me' : 'Don’t count me'; }
function openDiag() { $('diagText').value = logLines.join('\n'); gcLabel(); diagDlg.showModal(); }
$('diagCopy').addEventListener('click', () => {
  const t = $('diagText'); t.select();
  (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).catch(() => document.execCommand('copy'));
  $('diagCopy').textContent = 'Copied';
  setTimeout(() => $('diagCopy').textContent = 'Copy log', 1500);
});
$('diagClose').addEventListener('click', () => diagDlg.close());
$('gcBtn').addEventListener('click', () => { if (safeGet('skipgc') === 't') localStorage.removeItem('skipgc'); else safeSet('skipgc', 't'); gcLabel(); });

// ── Start ───────────────────────────────────────
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
render(); renderBar();
const cs = document.createElement('script');
// Inside the Android app, casting goes through Android's own Google Cast service instead.
cs.src = window.AndroidCast ? 'android-cast.js' : 'https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1';
cs.onerror = () => { diag('cast library failed to load'); els.castLabel.textContent = 'No cast'; };
document.head.appendChild(cs);
</script>
