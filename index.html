<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>RadioWizard</title>
<meta name="description" content="Find any internet radio station. Searches Radio Browser, TuneIn, SHOUTcast, Radio Garden, radio.net, iHeart, laut.fm, Icecast, OnlineRadioBox and SomaFM at once, then plays it here or casts it to Nest speakers.">
<meta name="theme-color" content="#0e0b1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>
  /* Themes: a color (Wizard purple, Red, Blue, Green, Gold, Plain) in dark or light, plus an accent; per device. */
  :root {
    color-scheme: dark;
    --bg: #0e0b1a; --surface: #181329; --surface-2: #221b3a; --line: #352b57;
    --text: #efeaff; --muted: #a59bc8; --accent: #9b6bff; --accent-2: #5fe3ff; --gold: #ffd36b;
    --good: #7ee7a8; --bad: #ff6b8a; --radius: 16px;
    --top-bg: rgba(14, 11, 26, .92); --bar-bg: rgba(20, 15, 36, .96); --star: rgba(255, 255, 255, .5);
    --bar: 132px;
  }
  :root[data-palette="red"] { --bg: #160d0f; --surface: #221418; --surface-2: #2e1b20; --line: #4a2a31; --text: #f5e9eb; --muted: #b89aa0; --accent: #e0455f; --accent-2: #ffb36b; --top-bg: rgba(22, 13, 15, .92); --bar-bg: rgba(30, 17, 21, .96); }
  :root[data-palette="blue"] { --bg: #0a0f1a; --surface: #121a2b; --surface-2: #1a2540; --line: #2b3a5e; --text: #e8eefc; --muted: #98a6c8; --accent: #4f8cff; --accent-2: #5fe3ff; --top-bg: rgba(10, 15, 26, .92); --bar-bg: rgba(15, 22, 38, .96); }
  :root[data-palette="green"] { --bg: #0b1410; --surface: #13211a; --surface-2: #1b2e24; --line: #2c4639; --text: #e9f3ec; --muted: #9db3a5; --accent: #3fbf7f; --accent-2: #c9e86b; --top-bg: rgba(11, 20, 16, .92); --bar-bg: rgba(16, 28, 22, .96); }
  :root[data-palette="gold"] { --bg: #14110a; --surface: #211c10; --surface-2: #2d2616; --line: #4a3f22; --text: #f5efdf; --muted: #b8ab8a; --accent: #d9a520; --accent-2: #ffe08a; --top-bg: rgba(20, 17, 10, .92); --bar-bg: rgba(28, 24, 14, .96); }
  :root[data-palette="plain"] { --bg: #121214; --surface: #1c1c20; --surface-2: #26262b; --line: #3a3a40; --text: #ececef; --muted: #a0a0a8; --accent: #9a9ca6; --accent-2: #c8c8d0; --top-bg: rgba(18, 18, 20, .92); --bar-bg: rgba(26, 26, 30, .96); }
  :root[data-mode="light"] { color-scheme: light; --bg: #f6f3fd; --surface: #ffffff; --surface-2: #ece6fb; --line: #d9d0f2; --text: #1d1530; --muted: #6c6287; --accent: #6b3fd9; --accent-2: #0b8fb3; --good: #1f8f52; --bad: #c22a4b; --top-bg: rgba(246, 243, 253, .92); --bar-bg: rgba(255, 255, 255, .96); --star: transparent; }
  :root[data-mode="light"][data-palette="red"] { --bg: #fcf5f6; --surface-2: #f6e4e7; --line: #ecd0d5; --text: #2a1418; --muted: #7d5f65; --accent: #b8283f; --accent-2: #c2600c; --top-bg: rgba(252, 245, 246, .92); }
  :root[data-mode="light"][data-palette="blue"] { --bg: #f4f7fd; --surface-2: #e2eaf8; --line: #ccd8ee; --text: #121c30; --muted: #5d6a85; --accent: #2a62d0; --accent-2: #0b8fb3; --top-bg: rgba(244, 247, 253, .92); }
  :root[data-mode="light"][data-palette="green"] { --bg: #f4f9f6; --surface-2: #e1efe7; --line: #cbe0d3; --text: #13231a; --muted: #5d7366; --accent: #1f8a55; --accent-2: #6b8a0b; --top-bg: rgba(244, 249, 246, .92); }
  :root[data-mode="light"][data-palette="gold"] { --bg: #fbf8f0; --surface-2: #f3ebd6; --line: #e6dabb; --text: #2a220f; --muted: #7a6d4d; --accent: #9a6f05; --accent-2: #b5520b; --top-bg: rgba(251, 248, 240, .92); }
  :root[data-mode="light"][data-palette="plain"] { --bg: #f5f5f6; --surface-2: #e9e9ec; --line: #d6d6db; --text: #1b1b1f; --muted: #6a6a73; --accent: #55575f; --accent-2: #3d6a9e; --top-bg: rgba(245, 245, 246, .92); }
  :root { --glow: color-mix(in srgb, var(--accent) 35%, transparent); --accent-ink: color-mix(in srgb, var(--accent) 12%, #0b0614); }
  :root[data-mode="light"] { --accent-ink: #ffffff; }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse at 50% -80px, color-mix(in srgb, var(--accent) 25%, transparent), transparent 360px),
      radial-gradient(1px 1px at 14% 6%, var(--star), transparent),
      radial-gradient(1px 1px at 36% 2%, var(--star), transparent),
      radial-gradient(1.5px 1.5px at 62% 9%, var(--star), transparent),
      radial-gradient(1px 1px at 81% 4%, var(--star), transparent),
      radial-gradient(1px 1px at 92% 12%, var(--star), transparent);
    background-repeat: no-repeat; background-attachment: fixed;
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    padding: 0 16px max(16px, env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 720px; margin: 0 auto; }

  header.top {
    position: sticky; top: 0; z-index: 5;
    margin: 0 -16px; padding: max(10px, env(safe-area-inset-top)) 16px 10px;
    background: var(--top-bg); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .titleRow { display: flex; align-items: center; gap: 10px; }
  .logo { width: 38px; height: 38px; border-radius: 10px; flex: none; }
  h1 {
    margin: 0; flex: 1; font: 700 1.35rem/1 "Cinzel Decorative", Georgia, serif; letter-spacing: .5px;
    background: linear-gradient(90deg, var(--gold), var(--accent) 55%, var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .castBtn {
    display: flex; align-items: center; gap: 6px; max-width: 46%;
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; cursor: pointer;
  }
  .castBtn svg { width: 20px; height: 20px; flex: none; }
  .castBtn span { font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .castBtn.on { border-color: var(--accent-2); color: var(--accent-2); box-shadow: 0 0 12px color-mix(in srgb, var(--accent-2) 25%, transparent); }
  .castBtn.nudge { animation: nudge 1s ease-in-out infinite alternate; }
  @keyframes nudge { to { box-shadow: 0 0 18px var(--glow); border-color: var(--accent); } }

  .searchRow { display: flex; gap: 8px; margin-top: 10px; }
  .search {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 10px;
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit; padding: 11px 0; }
  .search input::-webkit-search-cancel-button { display: none; }
  .iconBtn { background: none; border: 0; cursor: pointer; padding: 6px; color: var(--muted); display: grid; place-items: center; }
  .iconBtn svg { width: 20px; height: 20px; }
  .goBtn { border: 0; border-radius: 12px; padding: 0 16px; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer; }

  .tabs { display: flex; gap: 6px; margin-top: 10px; }
  .tab {
    flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 2px;
    font-size: .84rem; cursor: pointer; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tab[aria-selected="true"] { background: var(--surface-2); color: var(--text); border-color: var(--accent); }

  .status { color: var(--muted); font-size: .85rem; margin: 12px 2px 6px; min-height: 1.2em; }
  .srcChips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 10px;
    font-size: .8rem; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .chip b { color: var(--text); font-weight: 600; }
  .chip.wait { opacity: .7; }
  .chip.wait::after { content: " …"; }
  .chip.fail { border-color: rgba(255, 107, 138, .4); }
  .chip.pick { border-color: var(--accent); color: var(--text); background: var(--surface-2); }

  .picks { margin-top: 14px; }
  .picks h2 { font-size: .95rem; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
  .picks .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .picks .chip { font-size: .9rem; padding: 7px 12px; color: var(--text); }
  .hint { color: var(--muted); font-size: .85rem; margin-top: 16px; line-height: 1.5; }

  ul.list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  ul.list > li { min-width: 0; }
  .st {
    display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer;
  }
  .st:active { background: var(--surface-2); }
  .st.now { border-color: var(--accent); box-shadow: 0 0 14px var(--glow); }
  .st.checking { opacity: .55; }
  .st.dead { opacity: .45; }
  .art {
    width: 48px; height: 48px; border-radius: 10px; flex: none; object-fit: cover;
    background: var(--surface-2) url("icon-192.png") center / cover;
  }
  .st .body { flex: 1; min-width: 0; }
  .st .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st .meta { color: var(--muted); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st .srcs { display: flex; gap: 4px; margin-top: 3px; flex-wrap: wrap; }
  .tag { font-size: .68rem; padding: 1px 6px; border-radius: 6px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
  .tag.ok { color: var(--good); border-color: rgba(126, 231, 168, .35); }
  .tag.bad { color: var(--bad); border-color: rgba(255, 107, 138, .35); }
  .heart { background: none; border: 0; cursor: pointer; padding: 6px 8px; font-size: 1.75rem; line-height: 1; color: var(--muted); }
  .heart.on { color: #ff5c9a; text-shadow: 0 0 10px rgba(255, 92, 154, .5); }
  .more { display: block; margin: 12px auto; }
  .empty { color: var(--muted); text-align: center; padding: 30px 10px; }

  .notice {
    margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line);
    font-size: .9rem; display: flex; gap: 10px; align-items: flex-start;
  }
  .notice span { flex: 1; }
  .notice button { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0 2px; font-size: 1.1rem; }

  /* The player (like the casters): a card at the top; scrolling the list shrinks the top into a slim mini player. */
  .player { margin-top: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 8px; }
  .now { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .player .art { width: 64px; height: 64px; border-radius: 12px; }
  .player .art.spin { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 16px var(--glow); } }
  .np { flex: 1; min-width: 0; }
  .player > * { min-width: 0; }
  .np .label { display: flex; gap: 8px; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .np .label .state.live { color: var(--good); }
  .np .label .state.live::before { content: "● "; }
  .np .name { font-weight: 700; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np .sub { color: var(--muted); font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np .sub.live { color: var(--good); }
  .player .row { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .player .row .iconBtn { padding: 8px; color: var(--text); }
  .player .row .iconBtn svg { width: 24px; height: 24px; }
  .player .row .iconBtn:disabled { opacity: .35; cursor: default; }
  .player .row .vol { display: flex; gap: 4px; align-items: center; color: var(--accent); }
  .volnum { font-weight: 700; font-size: .9rem; font-variant-numeric: tabular-nums; min-width: 2.6em; text-align: left; }
  .play {
    width: 56px; height: 56px; border-radius: 50%; border: 0; flex: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 65%, #000)); color: #fff; display: grid; place-items: center;
    box-shadow: 0 0 16px var(--glow);
  }
  .play svg { width: 26px; height: 26px; }
  .play:disabled { opacity: .5; cursor: default; }
  .volRow { display: flex; align-items: center; gap: 10px; }
  .volRow .iconBtn { padding: 2px 4px; font-size: 1.15rem; }
  .player .heart { font-size: 1.75rem; padding: 4px 8px; }

  header.top.mini { padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: 6px; }
  header.top.mini .titleRow { zoom: .8; }
  header.top.mini .searchRow, header.top.mini .tabs, header.top.mini .volRow, header.top.mini .np .label,
  header.top.mini #shufBtn, header.top.mini #prevBtn, header.top.mini #muteBtn, header.top.mini #addBtn, header.top.mini .pTime { display: none !important; }
  header.top.mini .player { position: relative; display: flex; align-items: center; gap: 6px; padding: 7px 5px 7px 7px; border-radius: 12px; overflow: hidden; margin-top: 6px; }
  header.top.mini .now { flex: 1; min-width: 0; gap: 10px; cursor: pointer; }
  header.top.mini .player .art { width: 42px; height: 42px; border-radius: 9px; }
  header.top.mini .np .name { font-size: .92rem; }
  header.top.mini .np .sub { font-size: .78rem; }
  header.top.mini .player .row { flex: none; gap: 0; }
  header.top.mini .play { width: 42px; height: 42px; margin: 0 2px; }
  header.top.mini .play svg { width: 21px; height: 21px; }
  header.top.mini .player .heart { font-size: 1.5rem; padding: 4px; }
  header.top.mini .player .row .iconBtn { padding: 6px; }
  header.top.mini .prog { position: absolute; left: 0; right: 0; bottom: 0; gap: 0; }
  header.top.mini .pTrack { height: 2px; border-radius: 0; background: transparent; }
  html { overflow-anchor: none; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .22s; mix-blend-mode: normal; }
  .toTop { position: fixed; right: 16px; bottom: max(18px, env(safe-area-inset-bottom)); z-index: 6; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--surface-2); color: var(--text); font-size: 1.3rem; cursor: pointer; box-shadow: 0 4px 16px rgba(0, 0, 0, .35); }
  input[type=range] { flex: 1; accent-color: var(--accent); }

  footer { text-align: center; color: var(--muted); font-size: .78rem; margin: 26px 0 8px; line-height: 1.7; }
  footer a { color: var(--muted); }
  #version { cursor: default; user-select: none; }

  dialog {
    background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 18px;
    width: min(560px, calc(100vw - 32px)); max-height: 85dvh; padding: 16px;
  }
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  dialog h3 { margin: 0 0 10px; }
  dialog label.srcOpt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
  dialog label.srcOpt small { color: var(--muted); display: block; }
  dialog label.srcOpt.off { opacity: .5; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
  dialog .row button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
  dialog .row button.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .bcHead { display: flex; align-items: center; gap: 8px; margin: 12px 0 10px; flex-wrap: wrap; }
  .bcHead .who { flex: 1; min-width: 0; color: var(--muted); font-size: .9rem; }
  .bcHead .who b { color: var(--text); }
  .btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 12px; cursor: pointer; font-size: .9rem; }
  .btn.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .field { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; color: var(--text); font: inherit; outline: 0; }
  .field:focus { border-color: var(--accent); }
  .bcForm { display: grid; gap: 10px; margin-top: 14px; }
  .album { display: flex; gap: 14px; align-items: center; margin: 12px 0; }
  .album img { width: 110px; height: 110px; border-radius: 12px; object-fit: cover; flex: none; background: var(--surface-2); }
  .album h2 { margin: 0 0 4px; font-size: 1.15rem; }
  .album .by { color: var(--muted); margin-bottom: 10px; }
  .trk { display: flex; gap: 10px; align-items: center; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
  .trk .n { color: var(--muted); width: 1.6em; text-align: right; font-size: .85rem; }
  .trk .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trk .d { color: var(--muted); font-size: .8rem; }
  .trk.now { border-color: var(--accent); box-shadow: 0 0 12px var(--glow); }
  .trk.off { opacity: .45; cursor: default; }
  .subRow { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .subRow .sub { min-width: 0; }
  .sHeart { background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 1.45rem; line-height: 1; padding: 0 4px; flex: none; }
  .sHeart.on { color: #ff5c9a; }
  .prog { display: flex; align-items: center; gap: 8px; font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pTrack { flex: 1; height: 4px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .pTrack i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .volRow .iconBtn { font-size: 1.05rem; }
  #songsList { max-height: 60dvh; overflow: auto; }
  li.song { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  li.song .sTop { display: flex; align-items: center; gap: 6px; }
  li.song .sName { flex: 1; font-weight: 600; }
  li.song .heart { padding: 2px 6px; font-size: 1.6rem; }
  li.song .sMeta { color: var(--muted); font-size: .78rem; }
  li.song .sLinks { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; font-size: .82rem; }
  li.song .sLinks a { color: var(--accent-2); }
  .favHead { display: flex; align-items: center; gap: 8px; margin: 12px 0 4px; }
  .favHead .who { flex: 1; color: var(--muted); font-size: .9rem; }
  .favHead select { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 7px 8px; font: inherit; font-size: .88rem; }
  .catHead { margin: 16px 2px 6px; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .catHead small { color: var(--muted); font-weight: 400; letter-spacing: 0; }
  .plChoices { display: grid; gap: 6px; max-height: 40dvh; overflow: auto; }
  .plChoice { text-align: left; }
  .plChoice small { color: var(--muted); }
  .trk .add, .st .add { background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 1.35rem; padding: 2px 8px; line-height: 1; }
  .trk .add:hover, .st .add:hover { color: var(--accent); }
  .songHits h4 { margin: 14px 2px 6px; color: var(--muted); font-size: .85rem; font-weight: 600; }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; margin-bottom: 14px; }
  .sw { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-size: .88rem; color: var(--text); }
  .sw span { width: 18px; height: 18px; border-radius: 50%; background: var(--c); flex: none; border: 1px solid rgba(128, 128, 128, .35); }

// ── Theme: color, light or dark, and accent, per device (like Markpad and Hue Deck) ──
const PALETTES = [['Wizard', '', '#9b6bff'], ['Red', 'red', '#e0455f'], ['Blue', 'blue', '#4f8cff'], ['Green', 'green', '#3fbf7f'], ['Yellow', 'gold', '#d9a520'], ['Plain', 'plain', '#9a9ca6']];
const MODES = [['Dark', 'dark'], ['Light', 'light'], ['Like the system', '']];
const ACCENTS = [["Theme's own", ''], ['Purple', '#8b5cf6'], ['Pink', '#e0457b'], ['Red', '#d64545'], ['Orange', '#e8730c'], ['Gold', '#c99a06'], ['Green', '#2f9e5a'], ['Teal', '#14a3a3'], ['Cyan', '#22b8e0']];
const tStore = k => { try { return localStorage.getItem('rw_' + k) || ''; } catch (e) { return ''; } };
const tSave = (k, v) => { try { localStorage.setItem('rw_' + k, v); } catch (e) {} };
const sysLight = matchMedia('(prefers-color-scheme: light)');

  const d = document.documentElement, pal = tStore('palette'), mode = tStore('mode'), acc = tStore('accent');

  const light = mode === 'light' || (!mode && sysLight.matches);
  if (light) d.dataset.mode = 'light'; else delete d.dataset.mode;
  if (acc) d.style.setProperty('--accent', acc); else d.style.removeProperty('--accent');
  const meta = document.querySelector('meta[name=theme-color]');

};
applyTheme();
sysLight.addEventListener('change', () => applyTheme());
function drawTheme() {
  const pal = tStore('palette'), mode = tStore('mode'), acc = tStore('accent');
  const sw = (kind, v, n, c, on) => '<button class="sw' + (on ? ' on' : '') + '" data-' + kind + '="' + v + '" title="' + n + '" style="--c:' + c + '"><span></span>' + n + '</button>';
  $('themeBody').innerHTML = '<div class="themeSub">Color</div><div class="swatches">' + PALETTES.map(([n, v, c]) => sw('palette', v, n, c, v === pal)).join('') + '</div>'
    + '<div class="themeSub">Light or dark</div><div class="swatches">' + MODES.map(([n, v]) => sw('mode', v, n, v === 'dark' ? '#18151f' : v === 'light' ? '#f3f1f7' : 'linear-gradient(90deg,#f3f1f7 50%,#18151f 50%)', v === mode)).join('') + '</div>'
    + '<div class="themeSub">Accent (buttons, highlights)</div><div class="swatches">' + ACCENTS.map(([n, c]) => sw('accent', c, n, c || 'var(--accent)', c === acc)).join('')
    + '<label class="sw custom' + (acc && !ACCENTS.some(a => a[1] === acc) ? ' on' : '') + '"><input type="color" id="accentPick" value="' + (acc || '#9b6bff') + '"><span style="display:none"></span>Custom…</label></div>';
  $('accentPick').addEventListener('input', e => { tSave('accent', e.target.value); applyTheme(); $('themeBody').querySelectorAll('[data-accent]').forEach(b => b.classList.remove('on')); e.target.parentElement.classList.add('on'); });
}
$('themeBody').addEventListener('click', e => {
  const b = e.target.closest('button.sw');
  if (!b) return;
  if (b.dataset.palette != null) { tSave('palette', b.dataset.palette); tSave('accent', ''); }   // a new color brings its own accent
  else if (b.dataset.mode != null) tSave('mode', b.dataset.mode);
  else if (b.dataset.accent != null) tSave('accent', b.dataset.accent);

});
// The sun/moon button: a tap switches light and dark; holding it opens the colors (like Markpad, Hue Deck and LaunchPad).
const SUN = 'M12 4V2M12 22v-2M4 12H2M22 12h-2M5.6 5.6 4.2 4.2M19.8 19.8l-1.4-1.4M5.6 18.4l-1.4 1.4M19.8 4.2l-1.4 1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z';
const MOON = 'M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z';
function themeIcon() { $('themeIcon').setAttribute('d', document.documentElement.dataset.mode === 'light' ? MOON : SUN); }
themeIcon();
const _apply = applyTheme;
applyTheme = function () { _apply(); themeIcon(); };
let holdTimer = null, held = false;
const tb = $('themeBtn');
tb.addEventListener('pointerdown', () => { held = false; clearTimeout(holdTimer); holdTimer = setTimeout(() => { held = true; drawTheme(); $('themeDlg').showModal(); }, 500); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(t => tb.addEventListener(t, () => clearTimeout(holdTimer)));
tb.addEventListener('contextmenu', e => e.preventDefault());
tb.addEventListener('click', () => {
  if (held) { held = false; return; }

});
$('themeClose').addEventListener('click', () => $('themeDlg').close());
$('themeDlg').addEventListener('click', e => { if (e.target === $('themeDlg')) $('themeDlg').close(); });

// ── Small helpers ───────────────────────────────
const safeGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const safeSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const readJSON = (k, d) => { try { return JSON.parse(safeGet(k)) || d; } catch (e) { return d; } };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const unent = s => { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; };
const https = u => !u ? '' : u.startsWith('//') ? 'https:' + u : u;
const sleep = ms => new Promise(r => setTimeout(r, ms));

const logLines = [];
function diag(msg) {
  const t = new Date();
  const line = t.toTimeString().slice(0, 8) + '.' + String(t.getMilliseconds()).padStart(3, '0') + '  ' + msg;
  logLines.push(line);

const NATIVE = !!(window.AndroidCast && window.AndroidCast.httpGet);
diag('── opened · RadioWizard v' + VERSION + ' · ' + (NATIVE ? (window.AndroidCast.desktop ? 'RadioWizard Windows app' : 'RadioWizard Android app') : matchMedia('(display-mode: standalone)').matches ? 'app window' : 'browser tab') + ' · ' + navigator.userAgent);
window.addEventListener('error', e => diag('JS error: ' + e.message + ' @' + (e.lineno || '?')));
window.addEventListener('unhandledrejection', e => diag('unhandled: ' + (e.reason && e.reason.message || e.reason)));

// ── Web requests ────────────────────────────────
// In the Android app every request goes through the phone itself (no browser limits), so all directories work.
// On the website, only the directories that allow it can be searched.
const httpWait = {};
let httpNext = 1;
window.AndroidHttp = (id, r) => { const ok = httpWait[id]; delete httpWait[id]; if (ok) ok(r); };
function native(method, args) {

}
async function get(url, o = {}) {

    if (r.error) throw new Error(r.error);
    return r;   // { status, text, url, location, contentType }
  }
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeout);

    const res = await fetch(url, { method: o.method || 'GET', body: o.body || undefined, headers: o.type ? { 'Content-Type': o.type } : undefined, signal: ctl.signal, redirect: o.follow === false ? 'manual' : 'follow' });
    return { status: res.status, text: await res.text(), url: res.url, contentType: res.headers.get('content-type') || '' };
  } finally { clearTimeout(t); }
}
async function getJSON(url, o) {
  const r = await get(url, o);
  if (r.status >= 400) throw new Error('HTTP ' + r.status);
  return JSON.parse(r.text);
}

// ── Directories ─────────────────────────────────
// Each search gives back stations as { name, img, country, tags, codec, bitrate, pop, src: { src, url | rid } }.
// url = a stream link to play; rid = an id that has to be turned into a stream link first (resolve).
const RB_HOSTS = ['de1.api.radio-browser.info', 'de2.api.radio-browser.info', 'fi1.api.radio-browser.info', 'nl1.api.radio-browser.info', 'at1.api.radio-browser.info'];
let rbHost = null;
async function rb(path) {
  const hosts = rbHost ? [rbHost, ...RB_HOSTS.filter(h => h !== rbHost)] : RB_HOSTS;
  let last;
  for (const h of hosts) {
    try { const d = await getJSON('https://' + h + path, { headers: { 'User-Agent': 'RadioWizard/' + VERSION }, timeout: 10000 }); rbHost = h; return d; }
    catch (e) { last = e; }

}
const rbMap = s => ({
  name: s.name.trim(), img: s.favicon, country: s.countrycode, tags: (s.tags || '').split(',').filter(Boolean).slice(0, 4),
  codec: s.codec, bitrate: s.bitrate, pop: (s.votes || 0) + (s.clickcount || 0), home: s.homepage,
  src: { src: 'rb', url: s.url_resolved || s.url, rid: s.stationuuid },
});

let somaList = null;
const SOURCES = [
  {
    id: 'rb', name: 'Radio Browser', web: true, about: 'About 55,000 stations from everywhere',
    async search(q) {
      const e = encodeURIComponent(q);
      const [byName, byTag] = await Promise.all([
        rb('/json/stations/search?name=' + e + '&hidebroken=true&order=votes&reverse=true&limit=80').catch(() => []),
        rb('/json/stations/search?tag=' + e + '&hidebroken=true&order=votes&reverse=true&limit=80').catch(() => []),
      ]);
      return [...byName, ...byTag].map(rbMap);
    },
  },
  {
    id: 'tunein', name: 'TuneIn', web: false, about: 'Over 100,000 stations',
    async search(q) {
      const d = await getJSON('https://opml.radiotime.com/Search.ashx?render=json&types=station&formats=mp3,aac,ogg,hls&query=' + encodeURIComponent(q));
      const out = [];
      const walk = list => (list || []).forEach(x => {
        if (x.children) walk(x.children);
        if (x.type === 'audio' && x.guide_id && x.guide_id[0] === 's') out.push({
          name: x.text, img: x.image, tags: x.subtext ? [x.subtext] : [], codec: x.formats, bitrate: +x.bitrate || 0,
          pop: +x.reliability || 0, src: { src: 'tunein', rid: x.guide_id },

      walk(d.body);
      return out;
    },
    async resolve(rid) {
      const d = await getJSON('https://opml.radiotime.com/Tune.ashx?render=json&formats=mp3,aac,ogg,hls&id=' + encodeURIComponent(rid));
      const list = (d.body || []).filter(x => x.url).sort((a, b) => (b.reliability || 0) - (a.reliability || 0));
      return list.map(x => x.url);
    },
  },
  {
    id: 'shout', name: 'SHOUTcast', web: false, about: 'The classic SHOUTcast directory',
    async search(q) {
      const d = await getJSON('https://directory.shoutcast.com/Search/UpdateSearch', { method: 'POST', type: 'application/x-www-form-urlencoded', body: 'query=' + encodeURIComponent(q) });
      return (d || []).map(x => ({
        name: x.Name, tags: x.Genre ? [x.Genre] : [], codec: x.Format, bitrate: x.Bitrate, pop: x.Listeners || 0,
        src: { src: 'shout', rid: String(x.ID) },
      }));
    },
    async resolve(rid) { return playlistLinks((await get('https://yp.shoutcast.com/sbin/tunein-station.pls?id=' + rid)).text); },
  },
  {
    id: 'garden', name: 'Radio Garden', web: false, about: 'Stations from the Radio Garden globe',
    async search(q) {
      const d = await getJSON('https://radio.garden/api/search?q=' + encodeURIComponent(q), { headers: { Accept: 'application/json', Referer: 'https://radio.garden/' } });
      return ((d.hits && d.hits.hits) || []).map(h => h._source).filter(s => s && s.type === 'channel' && s.page).map(s => ({
        name: s.page.title, country: s.code, tags: s.page.subtitle ? [s.page.subtitle] : [],

  {
    id: 'radionet', name: 'radio.net', web: false, about: 'radio.net / radio.de, 50,000+ stations',
    async search(q) {

const SRC = Object.fromEntries(SOURCES.map(s => [s.id, s]));
const usable = s => NATIVE || s.web;

// Playlist files (.pls / .m3u) hold the real stream links.
function playlistLinks(text) {
  return String(text || '').split(/\r?\n/).map(l => l.trim())
    .map(l => (l.match(/^File\d+=(.+)$/i) || [null, l])[1].trim())
    .filter(l => /^https?:\/\//i.test(l));
}
const isPlaylistUrl = u => /\.(pls|m3u)(\?|$)/i.test(u) && !/\.m3u8/i.test(u);

// ── Stations: merging the same station found in several places ─────────
const normName = n => String(n || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '');
const normUrl = u => String(u || '').toLowerCase().replace(/^https?:\/\//, '').replace(/[?#].*$/, '').replace(/\/;?$/, '').replace(/:(80|443)\//, '/');
const srcKey = s => s.src + ':' + (s.url || s.rid);

let results = [];            // merged stations for the current search
let byUrl = new Map(), byName = new Map();
// Directories write countries differently ("CA", "Canada"): only two different two-letter codes count as different.
const sameCountry = (a, b) => { a = String(a || '').toUpperCase(); b = String(b || '').toUpperCase(); return !a || !b || a === b || a.length !== 2 || b.length !== 2; };
function addStation(x) {
  if (!x.name || !x.src) return;
  x.name = String(x.name).trim();
  const nk = normName(x.name);
  const uk = x.src.url ? normUrl(x.src.url) : null;
  let st = (uk && byUrl.get(uk)) || null;
  if (!st && nk.length >= 3) {
    st = (byName.get(nk) || []).find(s => sameCountry(s.country, x.country)) || null;
  }
  if (st) {
    if (!st.srcs.some(s => srcKey(s) === srcKey(x.src))) st.srcs.push(x.src);
    if (!st.img && x.img) st.img = x.img;
    if (!st.country && x.country) st.country = x.country;
    if (!st.codec && x.codec) st.codec = x.codec;
    if (!st.bitrate && x.bitrate) st.bitrate = x.bitrate;
    st.tags = [...new Set([...st.tags, ...(x.tags || [])])].slice(0, 5);
    st.pop = Math.max(st.pop, x.pop || 0);
  } else {
    st = { key: nk + '|' + (uk || srcKey(x.src)), name: x.name, img: https(x.img || ''), country: x.country || '', tags: (x.tags || []).filter(Boolean).slice(0, 5),
      codec: x.codec || '', bitrate: x.bitrate || 0, pop: x.pop || 0, srcs: [x.src], check: null };
    results.push(st);
    if (nk.length >= 3) { if (!byName.has(nk)) byName.set(nk, []); byName.get(nk).push(st); }

  if (uk) byUrl.set(uk, st);

function score(st, q) {
  const n = st.name.toLowerCase(), w = q.toLowerCase().trim();

  if (n === w) s += 100; else if (n.startsWith(w)) s += 60; else if (new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(n)) s += 45; else if (n.includes(w)) s += 30;
  if (st.tags.some(t => String(t).toLowerCase().includes(w))) s += 20;
  s += Math.min(st.srcs.length, 4) * 6;
  s += Math.log10((st.pop || 0) + 1) * 4;
  if (st.check === 'ok') s += 8;
  return s;
}

// ── Testing stations (Android app) ──────────────
// The phone opens each stream for a moment: only stations that really send sound are listed.
// play = [{ url, type }] best first, filled in once a station is tested or resolved.
async function linksFor(src) {
  if (src.url) return [src.url];
  const d = SRC[src.src];
  if (!d || !d.resolve) return [];
  try { return await d.resolve(src.rid); } catch (e) { diag('resolve ' + src.src + ' ' + src.rid + ' failed: ' + e.message); return []; }
}
function typeFor(url, hint) {

  if (/mpegurl|m3u8|hls/.test(t) || /\.m3u8/.test(u)) return 'application/x-mpegURL';
  if (/aac|mp4a|m4a/.test(t) || /aac/.test(u)) return 'audio/aac';
  if (/ogg|opus|vorbis/.test(t) || /\.(ogg|opus)(\?|$)/.test(u)) return 'audio/ogg';
  if (/flac/.test(t)) return 'audio/flac';
  return 'audio/mpeg';
}
async function probeUrl(url, depth = 0) {
  const r = await native('probe', { url, timeout: 7000 });
  if (!r.ok) return null;
  const ct = (r.contentType || '').toLowerCase();
  const head = r.head || '';
  if (/^#EXTM3U/.test(head) && /#EXT-X-/.test(head)) return { url: r.url || url, type: 'application/x-mpegURL' };
  if (/scpls|mpegurl|text\/|x-scpls/.test(ct) || /^\[playlist\]/i.test(head) || /^#EXTM3U/.test(head) || (isPlaylistUrl(url) && !/audio\/(mpeg|aac|ogg)/.test(ct))) {
    if (depth > 1) return null;
    for (const l of playlistLinks(head).slice(0, 3)) { const p = await probeUrl(l, depth + 1); if (p) return p; }

}
async function testStation(st) {

    for (const u of (await linksFor(src)).slice(0, 3)) {

      if (p) { p.src = src; return p; }
    }
  }

}
let checkQueue = [], checking = 0;
const CHECK_AT_ONCE = 8;
function queueCheck(list) {
  if (!NATIVE) return;
  list.forEach(st => { if (!st.check) { st.check = 'wait'; checkQueue.push(st); } });
  pumpChecks();
}
function pumpChecks() {
  while (checking < CHECK_AT_ONCE && checkQueue.length) {
    const st = checkQueue.shift();
    const tok = searchTok;
    checking++;
    st.check = 'checking';
    testStation(st).then(p => {
      st.check = p ? 'ok' : 'dead';
      if (p) st.play = p;
    }).finally(() => { checking--; if (tok === searchTok) scheduleRender(); pumpChecks(); });
  }

// ── Searching ───────────────────────────────────
let searchTok = 0, lastQuery = '', srcState = {}, showDead = false, shown = 40;
function runSearch(q) {
  q = q.trim();
  if (!q) return;
  lastQuery = q; showDead = false; shown = 40;
  const tok = ++searchTok;
  results = []; byUrl = new Map(); byName = new Map(); checkQueue = [];
  srcState = {};
  const on = SOURCES.filter(s => srcOn.includes(s.id) && usable(s));
  diag('search "' + q + '" in ' + on.map(s => s.id).join(', '));
  on.forEach(s => {
    srcState[s.id] = { wait: true, n: 0 };
    const t0 = performance.now();
    s.search(q).then(list => {
      if (tok !== searchTok) return;
      const merged = new Set();
      list.forEach(x => { const st = addStation(x); if (st) merged.add(st); });
      srcState[s.id] = { n: list.length };
      diag(s.id + ': ' + list.length + ' found in ' + ((performance.now() - t0) / 1000).toFixed(1) + 's');
      sortResults();
      queueCheck(results.slice(0, 80));
    }).catch(e => {
      if (tok !== searchTok) return;
      srcState[s.id] = { fail: true };
      diag(s.id + ' FAILED: ' + e.message);
    }).finally(() => { if (tok === searchTok) scheduleRender(); });
  });
  tab = 'search'; setTabs();
  render();
}
function sortResults() {
  results.forEach(st => st.sc = score(st, lastQuery));
  results.sort((a, b) => b.sc - a.sc);
}
let renderTimer = null;
function scheduleRender() { if (!renderTimer) renderTimer = setTimeout(() => { renderTimer = null; render(); }, 120); }

// ── Favorites and recent ────────────────────────
const keep = st => ({ ...(st.cat ? { cat: st.cat } : {}), key: st.key, name: st.name, img: st.img, country: st.country, tags: st.tags, codec: st.codec, bitrate: st.bitrate, pop: st.pop, srcs: st.srcs });

let recent = readJSON('rw_recent', []);

}

const PICKS = ['black metal', 'pagan', 'folk', 'synthwave', 'darkwave', 'halloween', 'gothic', 'metal', 'ambient', 'dark ambient', 'industrial', 'post-punk', 'medieval', 'celtic', 'doom', 'lofi', 'jazz', 'classical', 'blues', '80s'];

function stationRow(st, i) {

  const names = [...new Set(st.srcs.map(s => SRC[s.src] ? SRC[s.src].name : s.src))];

      h += '<div class="hint">RadioWizard searches ' + SOURCES.filter(usable).length + ' radio directories at once' + (NATIVE ? ' and tests every station before it’s listed' : '') + '.'
        + (NATIVE ? '' : '<br>TuneIn, SHOUTcast, Radio Garden, radio.net and OnlineRadioBox only work in the RadioWizard apps for Android and Windows (they block websites).') + '</div>';
    } else {

async function bcTracks(item) {

  if (hit && Date.now() - hit.at < 3 * 3600e3) return hit.tracks;
  const r = await get(item.url);
  const m = r.text.match(/data-tralbum="([^"]+)"/);
  if (!m) throw new Error('no album data');
  const d = JSON.parse(unent(m[1]));
  const tracks = (d.trackinfo || []).map((t, n) => ({
    n: t.track_num || n + 1, title: t.title, artist: t.artist || item.artist, album: item.title, art: item.art, dur: t.duration || 0, au: item.url,
    url: t.file && (t.file['mp3-v0'] || t.file['mp3-128']) || null,

// Radio: the song title comes from the station itself. The apps read it straight from the stream ("ICY" titles);
// laut.fm and SomaFM have their own song lists, and Icecast servers publish theirs (status-json.xsl).
// Cover art: Apple's free music search. Bandcamp songs already carry their title and cover.
let song = '', songArt = '', songAt = 0, songEnds = 0, songStarts = 0, songWatchTok = 0, songTimer = null;

const songKey = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();

function cleanTitle(t) {
  t = String(t || '');

  const ih = t.match(/^(.*?)\s*-?\s*text="([^"]*)"/);
  if (ih) t = (ih[1].trim() ? ih[1].trim() + ' - ' : '') + ih[2];
  t = t.replace(/\s+/g, ' ').trim();

// Watches the station being played (here or on the speaker) and checks its song every 20 seconds.
let songWatchKey = '';
function songWatch(st, url) {
  const key = st && url ? st.key + '|' + url : '';
  if (key && key === songWatchKey) return;   // already watching this one
  songWatchKey = key;
  const tok = ++songWatchTok;
  clearTimeout(songTimer);
  if (!st || !url) { setSong('', '', 0, 0); return; }
  let misses = 0;
  const check = async () => {
    if (tok !== songWatchTok) return;
    const r = await lookUpSong(st, url);
    if (tok !== songWatchTok) return;
    if (r) { misses = 0; setSong(cleanTitle(r.title), st.name, r.starts || 0, r.ends || 0); }
    else if (++misses === 3) diag('no song titles from ' + st.name);
    // laut.fm says when the song ends: check right after; otherwise every 20 seconds (less if it never answers).
    const wait = songEnds > Date.now() ? Math.min(songEnds - Date.now() + 1500, 60000) : misses >= 3 ? 60000 : 20000;

// ── Find songs: every song in the Bandcamp collection, searchable ──
// Indexing reads each album's song list once from Bandcamp's small app answer (about 11 KB an album),
// then keeps it on this device. New albums are added the next time the collection is reloaded and indexed.
let bcIdx = readJSON('rw_bc_idx', null);   // { at, alb: [{ u, t, a, art }], tr: [[albumIndex, n, title, dur]] }
let bcIdxBusy = '';
async function bcIndex() {
  if (bcIdxBusy) return;
  if (bcItems.length && !bcItems[0].band) { await bcLoad(); }   // collections loaded before 1.5 don't know the band ids yet
  // Bandcamp says "too many requests" if asked too fast, so: two albums at a time, a pause after each,
  // and a longer wait (then try again) when it says slow down. Albums it couldn't read are tried again next time.
  const old = bcIdx || { alb: [], tr: [], miss: [] };
  const known = new Map(old.alb.map((a, i) => [a.u, i]));
  const oldMiss = new Set(old.miss || []);
  const alb = [], tr = [], miss = [];
  const todo = [];
  bcItems.forEach(it => {
    const ai = alb.length;
    alb.push({ u: it.url, t: it.title, a: it.artist, art: it.art });
    const oi = known.get(it.url);
    if (oi != null && !oldMiss.has(it.url)) old.tr.filter(x => x[0] === oi).forEach(x => tr.push([ai, x[1], x[2], x[3]]));
    else todo.push([ai, it]);
  });
  let done = 0, stop = false;
  const total = todo.length;
  const show = () => { bcIdxBusy = 'Finding songs… ' + done + ' / ' + total + ' albums'; if (tab === 'bc' && !bcAlbum) { const el = document.querySelector('.bcIdxMsg'); if (el) el.textContent = bcIdxBusy; else render(); } };
  show();
  const save = () => { bcIdx = { at: Date.now(), alb, tr: tr.slice(), miss: miss.concat(todo.map(x => x[1].url)) }; try { localStorage.setItem('rw_bc_idx', JSON.stringify(bcIdx)); } catch (e) { diag('song index too big to keep'); } };
  const work = async () => {
    while (todo.length && !stop) {
      const [ai, it] = todo.shift();
      let ok = false;
      for (let tries = 0; tries < 4 && !ok && !stop; tries++) {
        try {
          const r = await get('https://bandcamp.com/api/mobile/24/tralbum_details?band_id=' + it.band + '&tralbum_id=' + it.tid + '&tralbum_type=' + (it.type || 'a'), { timeout: 15000 });
          if (r.status === 429) { diag('bandcamp says slow down: waiting'); await sleep(20000 * (tries + 1)); continue; }
          const d = JSON.parse(r.text);
          (d.tracks || []).forEach((t, n) => tr.push([ai, t.track_num || n + 1, t.title, Math.round(t.duration || 0)]));
          ok = true;
        } catch (e) { await sleep(1500); }
      }
      if (!ok) miss.push(it.url);
      done++;
      if (done % 5 === 0) show();
      if (done % 50 === 0) save();   // keep what's done, in case the app closes
      await sleep(350);
    }
  };
  await Promise.all([work(), work()]);
  save();
  diag('bandcamp index: ' + tr.length + ' songs in ' + alb.length + ' albums' + (bcIdx.miss.length ? ', ' + bcIdx.miss.length + ' to try again' : ''));
  bcIdxBusy = ''; render();
}
function bcSongMatches(f) {
  if (!bcIdx || !f) return [];
  const w = f.toLowerCase().split(/\s+/).filter(Boolean);
  const out = [];
  for (const x of bcIdx.tr) {
    const a = bcIdx.alb[x[0]];
    const hay = (x[2] + ' ' + a.a + ' ' + a.t).toLowerCase();
    if (w.every(k => hay.includes(k))) { out.push({ k: 'bc', title: x[2], artist: a.a, album: a.t, art: a.art, dur: x[3], n: x[1], au: a.u }); if (out.length >= 200) break; }
  }
  return out;
}

  let h = '';
  if (!favs.length) return '<div class="empty">Tap ♡ on a station to keep it here.</div>';
  h += '<div class="favHead"><div class="who">' + favs.length + ' favorite' + (favs.length === 1 ? '' : 's') + '</div><select id="favSort" aria-label="Order">'
    + [['cat', 'By category'], ['az', 'A → Z'], ['new', 'Newest first']].map(([v, n]) => '<option value="' + v + '"' + (v === favSort ? ' selected' : '') + '>' + n + '</option>').join('') + '</select></div>';
  const az = (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
  if (favSort === 'cat') {
    const groups = new Map();
    favs.forEach(st => { const c = favCat(st); if (!groups.has(c)) groups.set(c, []); groups.get(c).push(st); });
    const order = [...CATS.map(c => c[0]), 'Other'];
    const names = [...groups.keys()].sort((a, b) => (order.indexOf(a) < 0 ? 50 : order.indexOf(a)) - (order.indexOf(b) < 0 ? 50 : order.indexOf(b)) || a.localeCompare(b));
    names.forEach(c => {
      const list = groups.get(c).sort(az);
      h += '<div class="catHead">' + esc(c) + ' <small>· ' + list.length + '</small></div><ul class="list">' + list.map(st => { listed.push(st); return stationRow(st, listed.length - 1); }).join('') + '</ul>';
    });
    return h;
  }
  const list = favSort === 'az' ? favs.slice().sort(az) : favs;
  return h + '<ul class="list" style="margin-top:8px">' + list.map(st => { listed.push(st); return stationRow(st, listed.length - 1); }).join('') + '</ul>';
}
let catFor = null;
function catAsk(st) {
  catFor = favs.find(f => f.key === st.key);
  if (!catFor) return;
  $('catWhat').textContent = catFor.name + ' · now: ' + favCat(catFor);
  const all = [...new Set([...CATS.map(c => c[0]), ...favs.map(f => f.cat).filter(Boolean), 'Other'])];
  $('catChoices').innerHTML = all.map(c => '<button class="chip' + (c === favCat(catFor) ? ' pick' : '') + '" data-c="' + esc(c) + '">' + esc(c) + '</button>').join('');
  $('catNew').value = '';
  $('catDlg').showModal();
}
function catSet(c) {
  if (!catFor) return;
  if (c) catFor.cat = c; else delete catFor.cat;
  safeSet('rw_favs', JSON.stringify(favs));
  $('catDlg').close(); render();
}
$('catChoices').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b) catSet(b.dataset.c); });
$('catSet').addEventListener('click', () => { const v = $('catNew').value.trim(); if (v) catSet(v); });
$('catAuto').addEventListener('click', () => catSet(''));
$('catCancel').addEventListener('click', () => $('catDlg').close());
$('catDlg').addEventListener('click', e => { if (e.target === $('catDlg')) $('catDlg').close(); });


// Old song lists: entries saved before 1.5.1 can hold iHeart's raw song data; clean them and drop repeats.
{
  const fix = list => {
    let changed = false;
    const out = [];
    list.forEach(x => {
      const c = cleanTitle(x.song) || x.song;
      if (c !== x.song) { x.song = c; changed = true; }
      if (out.length && songKey(out[out.length - 1].song) === songKey(x.song)) { changed = true; return; }
      out.push(x);
    });
    return { out, changed };
  };
  let r = fix(heard); if (r.changed) { heard = r.out; safeSet('rw_heard', JSON.stringify(heard)); }
  r = fix(saved); if (r.changed) { saved = r.out; safeSet('rw_saved', JSON.stringify(saved)); }
}

// Saved songs backup (the same as the casters'): a small Markdown file in a folder you pick. Once picked, every
// heart and ✕ rewrites it, so a synced folder (Obsidian) stays up to date by itself. Each device has its own file
// (the device is in the name), and an app that opens empty takes the file's songs back before writing.
{
  const msg = t => { $('backupMsg').textContent = t; };
  const day = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const device = () => /Windows/.test(navigator.userAgent) ? 'pc' : /Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints < 2 ? 'mac'
    : Math.min(screen.width, screen.height) >= 600 ? 'tablet' : 'phone';
  const A = window.AndroidCast;
  const androidFolders = !!(A && A.pickBackupFolder && !A.desktop);
  const canPick = androidFolders || 'showDirectoryPicker' in window;
  $('savedFolder').hidden = !canPick;
  const db = (mode, fn) => new Promise((ok, fail) => {   // remembers the picked folder (localStorage can't hold it)
    const o = indexedDB.open('rw_backup', 1);
    o.onupgradeneeded = () => o.result.createObjectStore('kv');
    o.onerror = () => fail(o.error);
    o.onsuccess = () => {
      try { const t = o.result.transaction('kv', mode), r = fn(t.objectStore('kv')); t.oncomplete = () => ok(r.result); t.onerror = () => fail(t.error); }
      catch (e) { fail(e); }
    };
  });
  const listSong = line => {   // a line from this app's or the casters' lists → a saved song
    let m = line.match(/^- \*\*(.+)\*\* · (.*) · (.*) · (\d{4}-\d{2}-\d{2})\s*$/);
    if (m) return { song: m[2] ? m[2] + ' – ' + m[1] : m[1], station: m[3], at: Date.parse(m[4] + 'T12:00:00') || Date.now() };
    if (!(m = line.match(/^- \*\*(.+)\*\* · (.*) · (\d{4}-\d{2}-\d{2})\s*$/))) return null;
    return { song: m[1], station: m[2], at: Date.parse(m[3] + 'T12:00:00') || Date.now() };
  };
  const listText = () => '# RadioWizard · saved songs\n\nUpdated ' + new Date().toLocaleString() + ' · ' + saved.length + (saved.length === 1 ? ' song' : ' songs')
    + '\n\n' + saved.map(f => '- **' + f.song + '** · ' + (f.station || '') + ' · ' + day(f.at)).join('\n') + '\n';
  const fileName = () => 'radiowizard-saved-songs-' + device() + '.md';
  const openedEmpty = !saved.length;
  let linked = false, webDir = null, quiet = 0, writing = Promise.resolve();
  function takeBack(old) {
    let added = 0;
    for (const line of (old || '').split(/\r?\n/)) {
      const x = listSong(line);
      if (x && !isSaved(x.song)) { saved.push(x); added++; }
    }
    if (added) { saved.sort((a, b) => b.at - a.at); safeSet('rw_saved', JSON.stringify(saved)); renderBar(); if ($('songsDlg').open) drawSongs(); }
    return added;
  }
  function writeAndroid() { quiet++; A.saveBackup(fileName(), listText(), false); }
  function writeWeb() {
    const dir = webDir;
    writing = writing.then(async () => {
      const w = await (await dir.getFileHandle(fileName(), { create: true })).createWritable();
      await w.write(listText()); await w.close();
      msg('Auto-saving in ' + dir.name + ' as ' + fileName());
    }).catch(e => { diag('auto-save failed: ' + e.message); msg('Couldn’t auto-save. Tap Back up to try again.'); });
    return writing;
  }
  async function readWeb(dir) {
    try { return await (await (await dir.getFileHandle(fileName())).getFile()).text(); }
    catch (e) { if (e.name !== 'NotFoundError') throw e; return ''; }
  }
  function link(old, picked) {
    const added = (openedEmpty || picked) ? takeBack(old) : 0;
    linked = true;
    if (added) diag('took back ' + added + ' songs from ' + fileName());
    return added;
  }
  autoSave = async () => {
    if (linked) { androidFolders ? writeAndroid() : writeWeb(); return; }
    if (!webDir) return;
    try { if (await webDir.requestPermission({ mode: 'readwrite' }) !== 'granted') return; link(await readWeb(webDir), false); writeWeb(); }
    catch (e) { diag('auto-save failed: ' + e.message); }
  };
  // At start: pick up the remembered folder.
  (async () => {
    if (androidFolders) {
      try { const r = JSON.parse(A.readBackup(fileName())); if (r.ok) { if (link(r.text, false)) writeAndroid(); msg('Auto-saving as ' + fileName()); } } catch (e) {}
      return;
    }
    if (!('showDirectoryPicker' in window)) return;
    webDir = await db('readonly', kv => kv.get('dir')).catch(() => null);
    if (webDir && await webDir.queryPermission({ mode: 'readwrite' }) === 'granted') {
      try { if (link(await readWeb(webDir), false)) writeWeb(); msg('Auto-saving in ' + webDir.name + ' as ' + fileName()); } catch (e) { diag('auto-save folder failed: ' + e.message); }
    }
  })();
  window.onAndroidBackup = r => {
    if (r.where === 'picked') {
      try { const x = JSON.parse(A.readBackup(r.name)); const n = link(x.ok ? x.text : '', true); writeAndroid();
        if (n) msg('Took back ' + n + (n === 1 ? ' song' : ' songs') + ' from ' + r.name); } catch (e) { msg('Couldn’t read the backup folder.'); }
      return;
    }
    const auto = quiet > 0; if (auto) quiet--;
    if (r.ok) msg((auto ? 'Auto-saving in ' : 'Saved in ') + r.where + ' as ' + r.name);
    else msg(r.where === 'cancel' ? 'Backup cancelled.' : 'Couldn’t save the backup file.');
  };
  async function backUp(pickNew) {
    const name = fileName();
    if (androidFolders) { if (pickNew || !linked) { A.pickBackupFolder(name); return; } writeAndroid(); return; }
    if ('showDirectoryPicker' in window) {
      try {
        let dir = pickNew ? null : webDir || await db('readonly', kv => kv.get('dir')).catch(() => null);
        if (dir && await dir.requestPermission({ mode: 'readwrite' }) !== 'granted') dir = null;
        const picked = !dir;
        if (picked) {
          dir = await window.showDirectoryPicker({ id: 'rw-backup', mode: 'readwrite', startIn: 'documents' });
          await db('readwrite', kv => kv.put(dir, 'dir')).catch(() => {});
        }
        webDir = dir;
        const n = link(await readWeb(dir), picked);
        await writeWeb();
        if (n) msg('Took back ' + n + (n === 1 ? ' song' : ' songs') + ' from ' + name);
        return;
      } catch (e) { if (e.name === 'AbortError') { msg('Backup cancelled.'); return; } diag('backup folder failed: ' + e.message); }
    }
    if (!saved.length) { msg('No saved songs to back up yet.'); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([listText()], { type: 'text/markdown' }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    msg('Backup downloaded as ' + name);
  }
  $('savedBackup').addEventListener('click', () => backUp(false));
  $('savedFolder').addEventListener('click', () => backUp(true));
  $('savedRestore').addEventListener('click', () => $('savedFile').click());
  $('savedFile').addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const n = takeBack(await file.text());
    autoSave();
    msg(n ? 'Restored ' + n + (n === 1 ? ' song' : ' songs') + '.' : 'Nothing new in that file.');
  });
}

// ── Share, diag log, version ────────────────────
$('shareApp').addEventListener('click', e => {
  e.preventDefault();
  const url = 'https://cc666debug.github.io/radio-wizard/', text = 'RadioWizard: find any radio station and cast it to your speakers.';
  if (window.AndroidCast && window.AndroidCast.shareText) { window.AndroidCast.shareText('RadioWizard', text + '\n' + url); return; }
  if (navigator.share) navigator.share({ title: 'RadioWizard', text, url }).catch(() => {});
  else navigator.clipboard.writeText(url).then(() => showNotice('Link copied.'));
});
const ver = $('version');
ver.textContent = 'v' + VERSION;
let taps = 0, tapTimer = null;
ver.addEventListener('click', () => {
  taps++; clearTimeout(tapTimer); tapTimer = setTimeout(() => taps = 0, 1500);
  if (taps >= 5) { taps = 0; openDiag(); }
});
const diagDlg = $('diagDlg');
function gcLabel() { $('gcBtn').textContent = safeGet('skipgc') === 't' ? 'Count me' : 'Don’t count me'; }
function openDiag() { $('diagText').value = logLines.join('\n'); gcLabel(); diagDlg.showModal(); }
$('diagCopy').addEventListener('click', () => {
  const t = $('diagText'); t.select();
  (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).catch(() => document.execCommand('copy'));
  $('diagCopy').textContent = 'Copied';
  setTimeout(() => $('diagCopy').textContent = 'Copy log', 1500);
});
$('diagClose').addEventListener('click', () => diagDlg.close());
$('gcBtn').addEventListener('click', () => { if (safeGet('skipgc') === 't') localStorage.removeItem('skipgc'); else safeSet('skipgc', 't'); gcLabel(); });

// ── Start ───────────────────────────────────────
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
render(); renderBar();
const cs = document.createElement('script');
// Inside the Android app, casting goes through Android's own Google Cast service instead.
cs.src = window.AndroidCast ? 'android-cast.js' : 'https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1';
cs.onerror = () => { diag('cast library failed to load'); els.castLabel.textContent = 'No cast'; };
document.head.appendChild(cs);
</script>
