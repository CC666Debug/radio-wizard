[package]
name = "radio-wizard"
version = "1.35.2"
description = "RadioWizard: find any radio station, play your Bandcamp collection, cast to Nest speakers"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
# web requests for the page (radio directories and Bandcamp block web pages, not apps)
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
# finding Google Cast speakers on the home network
mdns-sd = "0.21"
# remembers the window's size and spot between runs
tauri-plugin-window-state = "2"
# the backup folder picker: a real Windows dialog owned by RW's window (the WebView's own picker could leave the window locked)
rfd = "0.18"

# small and fast
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
